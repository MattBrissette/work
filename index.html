            </div>
            <div class="flex justify-between items-center text-xs pb-1">
              <span class="text-zinc-500 font-label font-medium">GITHUB:</span>
              <a href="https://github.com/MattBrissette" target="_blank" rel="noopener noreferrer" class="font-medium text-zinc-200 hover:text-white transition-colors font-inter">github.com/MattBrissette</a>
            </div>
            <div class="flex justify-between items-center text-xs pb-1">
              <span class="text-zinc-500 font-label font-medium">BEHANCE:</span>
              <a href="https://www.behance.net/matthieubrissette" target="_blank" rel="noopener noreferrer" class="font-medium text-zinc-200 hover:text-white transition-colors font-inter">behance.net/matthieubrissette</a>
            </div>
          </div>
        `;
      }
    }

    const navAbout = document.getElementById('nav-about');
    const navContact = document.getElementById('nav-contact');

    function closeInfoModal() {
      if (lenis) lenis.start();
      if (infoModal) {
        infoModal.classList.add('pointer-events-none');
        infoModal.classList.remove('opacity-100');
      }
    }

    if (navAbout) navAbout.addEventListener('click', (e) => { e.preventDefault(); openInfoModal('about'); });
    if (navContact) navContact.addEventListener('click', (e) => { e.preventDefault(); openInfoModal('contact'); });
    if (closeInfoModalBtn) {
      closeInfoModalBtn.addEventListener('click', closeInfoModal);
    }
    if (infoModal) {
      infoModal.addEventListener('click', (e) => {
        if (e.target === infoModal) closeInfoModal();
      });
    }

    let isZoomed = false;
    let isDraggingImg = false;
    let startX = 0, startY = 0;
    let translateX = 0, translateY = 0;
    let currentX = 0, currentY = 0;
    const ZOOM_FACTOR = 2.2;

    function openLightbox(slideIndex) {
      if (!lightboxModal || !lightboxImg) return;
      
      currentSlideIndex = slideIndex;
      lightboxModal.classList.remove('pointer-events-none');
      lightboxModal.classList.add('opacity-100');

      const thumbsContainer = document.getElementById('lightbox-thumbnails');
      if (thumbsContainer) {
        thumbsContainer.innerHTML = '';
        activeSlides.forEach((slideSrc, i) => {
          const isVid = slideSrc.endsWith('.mp4') || slideSrc.endsWith('.webm');
          let thumb;
          if (isEmbedSrc(slideSrc)) {
            thumb = document.createElement('img');
            thumb.src = slideSrc === 'embed:loam-how-it-works' ? LOAM_EMBED_THUMB : EMBED_THUMB;
          } else if (isVid) {
            thumb = document.createElement('video');
            thumb.src = slideSrc;
            thumb.muted = true;
            thumb.playsInline = true;
            thumb.loop = true;
            thumb.autoplay = true;
          } else {
            thumb = document.createElement('img');
            thumb.src = slideSrc;
          }
          thumb.className = `w-14 h-10 object-cover rounded-none border cursor-pointer transition-all duration-200 ${i === currentSlideIndex ? 'border-white opacity-100 scale-105 shadow-[0_0_8px_#ffffff]' : 'border-transparent opacity-40 hover:opacity-80'}`;
          thumb.addEventListener('click', (e) => {
            e.stopPropagation();
            updateLightboxSlide(i);
          });
          thumbsContainer.appendChild(thumb);
        });
      }

      updateLightboxSlide(slideIndex);
    }

    function updateLightboxSlide(index) {
      const totalSlides = activeSlides.length || 8;
      if (index < 0) index = totalSlides - 1; 
      if (index >= totalSlides) index = 0;

      currentSlideIndex = index;
      
      isZoomed = false;
      isDraggingImg = false;
      translateX = 0;
      translateY = 0;
      currentX = 0;
      currentY = 0;
      
      const currentSrc = activeSlides[currentSlideIndex];
      const isVid = currentSrc && (currentSrc.endsWith('.mp4') || currentSrc.endsWith('.webm'));
      const lightboxEmbed = document.getElementById('lightbox-embed');

      if (lightboxEmbed) {
        if (isEmbedSrc(currentSrc)) {
          lightboxEmbed.srcdoc = getEmbedHTML(currentSrc);
          lightboxEmbed.style.aspectRatio = EMBED_ASPECT_MAP[currentSrc] || EMBED_ASPECT;
          lightboxEmbed.classList.remove('hidden');
        } else {
          lightboxEmbed.classList.add('hidden');
          lightboxEmbed.removeAttribute('srcdoc');
        }
      }

      if (isEmbedSrc(currentSrc)) {
        if (lightboxImg) lightboxImg.classList.add('hidden');
        if (lightboxVideo) { lightboxVideo.pause(); lightboxVideo.classList.add('hidden'); }
      } else if (isVid) {
        if (lightboxImg) lightboxImg.classList.add('hidden');
        if (lightboxVideo) {
          lightboxVideo.classList.remove('hidden');
          lightboxVideo.src = currentSrc;
          lightboxVideo.play().catch(() => {});
          lightboxVideo.className = "max-w-full max-h-full object-contain cursor-zoom-in transition-transform duration-300 ease-out select-none";
          lightboxVideo.style.transform = 'scale(1) translate(0px, 0px)';
        }
      } else {
        if (lightboxVideo) {
          lightboxVideo.pause();
          lightboxVideo.classList.add('hidden');
        }
        if (lightboxImg) {
          lightboxImg.classList.remove('hidden');
          lightboxImg.src = currentSrc;
          lightboxImg.className = "max-w-full max-h-full object-contain cursor-zoom-in transition-transform duration-300 ease-out select-none";
          lightboxImg.style.transform = 'scale(1) translate(0px, 0px)';
        }
      }

      if (lightboxIndicator) {
        lightboxIndicator.innerText = `IMAGE ${currentSlideIndex + 1} OF ${totalSlides} // Click Image to Zoom / Drag to Pan`;
      }

      const thumbsContainer = document.getElementById('lightbox-thumbnails');
      if (thumbsContainer) {
        const children = thumbsContainer.children;
        for (let i = 0; i < children.length; i++) {
          if (i === currentSlideIndex) {
            children[i].className = 'w-14 h-10 object-cover rounded-none border border-white opacity-100 scale-105 shadow-[0_0_8px_#ffffff] transition-all duration-200';
          } else {
            children[i].className = 'w-14 h-10 object-cover rounded-none border border-transparent opacity-40 hover:opacity-80 transition-all duration-200';
          }
        }
      }
    }

    function closeLightbox() {
      if (!lightboxModal) return;
      if (lightboxVideo) lightboxVideo.pause();
      lightboxModal.classList.add('pointer-events-none');
      lightboxModal.classList.remove('opacity-100');
    }

    if (closeLightboxBtn) {
      closeLightboxBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        closeLightbox();
      });
    }

    const btnPrev = document.getElementById('lightbox-prev');
    const btnNext = document.getElementById('lightbox-next');
    if (btnPrev) {
      btnPrev.addEventListener('click', (e) => {
        e.stopPropagation();
        updateLightboxSlide(currentSlideIndex - 1);
      });
    }
    if (btnNext) {
      btnNext.addEventListener('click', (e) => {
        e.stopPropagation();
        updateLightboxSlide(currentSlideIndex + 1);
      });
    }

    function handleKeyEvents(e) {
      const isInputFocused = document.activeElement && ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName);
      
      if (lightboxModal && !lightboxModal.classList.contains('pointer-events-none')) {
        if (e.key === 'ArrowLeft') {
          updateLightboxSlide(currentSlideIndex - 1);
        } else if (e.key === 'ArrowRight') {
          updateLightboxSlide(currentSlideIndex + 1);
        } else if (e.key === 'Escape') {
          closeLightbox();
        }
      } else if (infoModal && !infoModal.classList.contains('pointer-events-none')) {
        if (e.key === 'Escape') {
          closeInfoModal();
        }
      } else if (isIndexOpen) {
        if (e.key === 'Escape' || e.key === 'i' || e.key === 'I') {
          closeIndexOverlay();
        }
      } else if (!isInputFocused) {
        if (e.key === 'i' || e.key === 'I') {
          openIndexOverlay();
        }
      }
    }

    window.addEventListener('keydown', handleKeyEvents, true);

    if (lightboxImg) {
      lightboxImg.addEventListener('click', (e) => {
        if (isDraggingImg) return;

        const totalSlides = activeSlides.length || 8;
        if (!isZoomed) {
          isZoomed = true;
          lightboxImg.classList.remove('cursor-zoom-in');
          lightboxImg.classList.add('cursor-grab');
          if (lightboxIndicator) lightboxIndicator.innerText = `IMAGE ${currentSlideIndex + 1} OF ${totalSlides} // Drag to Pan / Click to Zoom Out`;
          
          lightboxImg.classList.remove('transition-transform', 'duration-300', 'ease-out');
          
          translateX = 0;
          translateY = 0;
          currentX = 0;
          currentY = 0;
          lightboxImg.style.transform = `scale(${ZOOM_FACTOR}) translate(0px, 0px)`;
        } else {
          isZoomed = false;
          lightboxImg.classList.add('cursor-zoom-in');
          lightboxImg.classList.remove('cursor-grab', 'cursor-grabbing');
          if (lightboxIndicator) lightboxIndicator.innerText = `IMAGE ${currentSlideIndex + 1} OF ${totalSlides} // Click Image to Zoom / Drag to Pan`;
          
          lightboxImg.classList.add('transition-transform', 'duration-300', 'ease-out');
          lightboxImg.style.transform = 'scale(1) translate(0px, 0px)';
          translateX = 0;
          translateY = 0;
          currentX = 0;
          currentY = 0;
        }
      });

      lightboxImg.addEventListener('mousedown', (e) => {
        if (!isZoomed) return;
        isDraggingImg = false;
        startX = e.clientX;
        startY = e.clientY;
        currentX = translateX;
        currentY = translateY;
        
        lightboxImg.classList.remove('cursor-grab');
        lightboxImg.classList.add('cursor-grabbing');
        
        const onMouseMove = (moveEvent) => {
          const dx = moveEvent.clientX - startX;
          const dy = moveEvent.clientY - startY;
          if (Math.abs(dx) > 3 || Math.abs(dy) > 3) {
            isDraggingImg = true;
          }
          translateX = currentX + dx / ZOOM_FACTOR;
          translateY = currentY + dy / ZOOM_FACTOR;
          
          lightboxImg.style.transform = `scale(${ZOOM_FACTOR}) translate(${translateX}px, ${translateY}px)`;
        };

        const onMouseUp = () => {
          lightboxImg.classList.remove('cursor-grabbing');
          if (isZoomed) lightboxImg.classList.add('cursor-grab');
          window.removeEventListener('mousemove', onMouseMove);
          window.removeEventListener('mouseup', onMouseUp);
          
          setTimeout(() => { isDraggingImg = false; }, 50);
        };

        window.addEventListener('mousemove', onMouseMove);
        window.addEventListener('mouseup', onMouseUp);
      });
    }

    const _scratchVecWorld = new THREE.Vector3();
    const _scratchVecHud = new THREE.Vector3();
    const _scratchVecBall = new THREE.Vector3();

    function setSlidePosition(progressRatio, targetVec) {
      const clampedRatio = Math.max(0, Math.min(1, progressRatio));
      const angle = clampedRatio * Math.PI * 2 * revolutions;
      const yPos = (clampedRatio * heightSpan) - (heightSpan / 2);

      const r = spiralRadius + (rampWidth * 0.5); 
      targetVec.set(
        Math.cos(angle) * r,
        yPos + sphereRadius,
        Math.sin(angle) * r
      );
    }

    const clock = new THREE.Clock();
    let ballProgress = 0.96; 
    const ballSpeed = 0.05; 
    let ballDelay = 0; 

    let isTabVisible = true;

    document.addEventListener('visibilitychange', () => {
      isTabVisible = !document.hidden;
      if (isTabVisible) {
        clock.getDelta(); 
      }
    });

    function renderLoop() {
      requestAnimationFrame(renderLoop);

      if (!isTabVisible) return;

      if (lenis && !isModalOrOverlayActive() && !isTransitioning) {
        lenis.raf(performance.now());
      }

      mouseLerpX += (mouse.x - mouseLerpX) * 0.06;
      mouseLerpY += (mouse.y - mouseLerpY) * 0.06;

      const delta = clock.getDelta();
      const elapsedTime = clock.getElapsedTime();

      wetU.uTime.value = elapsedTime;

      if (rainMaterial && rainMaterial.uniforms) {
        rainMaterial.uniforms.uTime.value = elapsedTime;
        rainMaterial.uniforms.uWind.value.set(
          -0.5 - (mouseLerpX * 0.35),
          0.12 - (mouseLerpY * 0.2)
        );
      }

      updateRainImpacts(delta, elapsedTime);

      if (ballDelay > 0) { ballDelay -= delta; } else { ballProgress -= ballSpeed * delta; }
      if (ballProgress < 0.0) {
        ballProgress = 1.0; 
      }

      if (!isFocused && !isIndexOpen) {
        if (!isTransitioning) {
          tickScroll();
          updateSpiralTransform(scrollProgress);

          camera.position.x = mouseLerpX * 0.8;
          camera.position.y = 1.8 + (mouseLerpY * 0.5);
          camera.position.z = 9.8 - (Math.abs(mouseLerpX) * 0.4);

          cameraTarget.set(0, 0.2, 0);
          camera.lookAt(cameraTarget);
        }

        let currentScale = 1.0;
        if (ballDelay <= 0) {
          if (ballProgress > 0.94) {
            currentScale = (1.0 - ballProgress) / 0.06;
          } else if (ballProgress < 0.06) {
            currentScale = ballProgress / 0.06;
          }
        }
        crystalSphere.scale.setScalar(currentScale);

        setSlidePosition(ballProgress, _scratchVecBall);
        crystalSphere.position.copy(_scratchVecBall);

        crystalSphere.rotation.x -= 0.04 * delta * 60;
        crystalSphere.rotation.y -= 0.015 * delta * 60;

        let closestIndex = 0;
        let minDiff = Infinity;
        
        for (let i = 0; i < activeProjectMeshes.length; i++) {
          const mesh = activeProjectMeshes[i];
          mesh.getWorldPosition(_scratchVecWorld);
          
          const distToCenter = Math.pow(_scratchVecWorld.x, 2) + Math.pow(_scratchVecWorld.y - 1.2, 2);
          if (distToCenter < minDiff && _scratchVecWorld.z > 0) {
            minDiff = distToCenter;
            closestIndex = i;
          }
        }

        if (closestIndex !== activeProjectIndex) {
          activeProjectIndex = closestIndex;
        }

        const activeMesh = activeProjectMeshes[activeProjectIndex];
        if (activeMesh && hudPrompt && !isTransitioning) {
          activeMesh.getWorldPosition(_scratchVecWorld);
          _scratchVecHud.copy(_scratchVecWorld);
          _scratchVecHud.y += 1.34; 
          _scratchVecHud.project(camera);

          if (_scratchVecHud.z > 0 && _scratchVecHud.x > -1 && _scratchVecHud.x < 1 && _scratchVecHud.y > -1 && _scratchVecHud.y < 1) {
            const xScreen = (_scratchVecHud.x * 0.5 + 0.5) * window.innerWidth;
            const yScreen = (_scratchVecHud.y * -0.5 + 0.5) * window.innerHeight;

            hudPrompt.style.transform = `translate3d(${xScreen}px, ${yScreen}px, 0) translate(-50%, -100%)`;
            hudPrompt.style.opacity = '1';

            const hudTextEl = document.getElementById('hud-prompt-text');
            if (hudTextEl && projects[activeProjectIndex]) {
              const targetClientText = projects[activeProjectIndex].client.toUpperCase();
              if (hudTextEl.innerText !== targetClientText) {
                hudTextEl.innerText = targetClientText;
              }
            }
          } else {
            hudPrompt.style.opacity = '0';
          }
        } else if (hudPrompt && isTransitioning) {
          hudPrompt.style.opacity = '0';
        }

        if (!isTransitioning) {
          raycaster.setFromCamera(mouse, camera);
          const intersects = raycaster.intersectObjects(raycastTargets, false);

          if (intersects.length > 0) {
            const hitRoot = intersects[0].object.userData.parentItemGroup;
            if (hoveredMesh !== hitRoot) {
              if (hoveredMesh) {
                gsap.to(hoveredMesh.scale, { x: 1, y: 1, z: 1, duration: 0.2 });
              }
              hoveredMesh = hitRoot;
              gsap.to(hoveredMesh.scale, { x: 1.08, y: 1.08, z: 1.08, duration: 0.2 });
            }
          } else {
            if (hoveredMesh) {
              gsap.to(hoveredMesh.scale, { x: 1, y: 1, z: 1, duration: 0.2 });
              hoveredMesh = null;
            }
          }
        }

        if (scrollProgressIndicator) {
          scrollProgressIndicator.style.top = `${scrollProgress * 95}%`;
        }
      }

      renderer.render(scene, camera);
    }

    function preloadPrimaryImages() {
      const preloadTask = () => {
        projects.forEach((proj) => {
          if (proj.images && proj.images[0]) {
            const img = new Image();
            img.src = proj.images[0];
          }
        });
      };

      if ('requestIdleCallback' in window) {
        requestIdleCallback(preloadTask);
      } else {
        setTimeout(preloadTask, 1000);
      }
    }

    window.onload = function() {
      updateSpiralTransform(0.0);
      renderLoop();
      runIntroShuffleSequence(0);
      isSiteLoaded = true;
      preloadPrimaryImages();
      gsap.from("header", { opacity: 0, y: -20, duration: 1.2, delay: 0.3, ease: "power2.out" });

      if (lenis) {
        lenis.scrollTo(0, { immediate: true });
      }
    }

    window.addEventListener('resize', () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });
  </script>

<!DOCTYPE html>

<body>
<main>

<ellipse cx="790" cy="380" rx="215" ry="140" fill="none" stroke="rgba(255,255,255,.14)" stroke-dasharray="2 8" class="st" data-from="2" data-to="4"/>

<g class="st" data-from="1" data-to="4"><line x1="230" y1="380" x2="258" y2="380" stroke="#a78bfa" stroke-width="1.2"/><circle cx="258" cy="380" r="5" fill="#a78bfa"/></g>

<g class="d" style="--d:1.8s"><circle cx="1140" cy="312" r="9" fill="none" stroke="#3b82f6" opacity=".5"/><circle cx="1140" cy="312" r="5" fill="#3b82f6"/></g>

<g class="d" style="--d:2.2s">
<line x1="1140" y1="368" x2="1140" y2="402" stroke="#a78bfa" stroke-width="1.2"/><path d="M1134 396L1140 404L1146 396" fill="none" stroke="#a78bfa" stroke-width="1.2"/>
<text x="1152" y="390" class="mono" font-size="11" fill="#a78bfa">export</text>
<rect x="1040" y="414" width="200" height="150" rx="12" fill="#0b0a10" stroke="rgba(167,139,250,.6)"/>
<text x="1056" y="438" class="mono" font-size="11" fill="rgba(255,255,255,.5)">notes.md</text>
</g>
<g class="mono" font-size="11" fill="rgba(255,255,255,.85)">
<text class="d" style="--d:2.5s" x="1056" y="466">## constellation</text>
<text class="d" style="--d:2.75s" x="1056" y="488" fill="#10b981">- the octopus mind</text>
<text class="d" style="--d:3s" x="1056" y="508" fill="#ec4899">- rover car chair</text>
<text class="d" style="--d:3.25s" x="1056" y="528" fill="#3b82f6">- akzidenz-grotesk</text>

<script>
(function() {
  const $ = s => document.querySelector(s), svg = $('#s'), NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;
  const COL = ['#3b82f6','#10b981','#f59e0b','#8b5cf6','#ec4899','#ec4899'];
  const SRC = ['duckduckgo','wikipedia','openalex','hacker news','the met','art institute of chicago'];
  const CAP = [
    'Type anything into one search box.',
    'Every query fans out in parallel to six live sources.',
    'Results merge into one field of nodes you can orbit.',
    'Inspect a node, or expand it into a new search.',
    'Pin discoveries to a constellation, then export Markdown notes.'
  ];
  const DUR = [2600, 3600, 3800, 4000, 6200];
  let lines = '', pills = '';
  SRC.forEach((n, i) => {
    const y = 205 + 70 * i;
    lines += '<path class="dash" d="M258 380C280 380 280 ' + y + ' 300 ' + y + '" stroke="#a78bfa"/><path class="dash" d="M520 ' + y + 'C545 ' + y + ' 545 380 572 380" stroke="' + COL[i] + '"/>';
    pills += '<g class="pill"><rect x="300" y="' + (y - 18) + '" width="220" height="36" rx="18" fill="#0d0b14" stroke="rgba(255,255,255,.14)"/><circle class="live" cx="321" cy="' + y + '" r="4" fill="' + COL[i] + '"/><text x="335" y="' + (y + 4) + '" class="mono" font-size="12" fill="rgba(255,255,255,.85)">' + n + '</text></g>';
  });
  $('#lines').innerHTML = lines;
  $('#pills').innerHTML = pills;

  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const N = 22, F = 1, nodes = [], ng = $('#nodes');
  for (let i = 0; i < N; i++) {
    const r = i === F ? .78 : .3 + .7 * rnd(), c = document.createElementNS(NS, 'circle');
    c.setAttribute('fill', COL[i % 6]);
    ng.appendChild(c);
    nodes.push({ c, r, a: i === F ? 4.9 : rnd() * 6.283, w: (.09 + .14 * (1 - r)) * (reduce ? 0 : 1), h: (rnd() - .5) * 2, x: 0, y: 0 });
  }
  const kg = $('#kids'), kids = [];
  for (let i = 0; i < 6; i++) {
    const c = document.createElementNS(NS, 'circle');
    c.setAttribute('r', 3.5);
    c.setAttribute('fill', ['#10b981','#3b82f6','#f59e0b','#10b981','#8b5cf6','#10b981'][i]);
    kg.appendChild(c);
    kids.push(c);
  }
  const kl = document.createElementNS(NS, 'text');
  kl.setAttribute('class', 'mono');
  kl.setAttribute('font-size', 11);
  kl.setAttribute('fill', '#a78bfa');
  kl.setAttribute('x', 22);
  kl.setAttribute('y', -34);
  kl.textContent = 'new search: cephalopod';
  kg.appendChild(kl);

  let emT = null;
  function frame(ms) {
    const t = ms / 1000;
    nodes.forEach((n, i) => {
      const a = n.a + n.w * t;
      const d = (Math.sin(a) + 1) / 2;
      const e = emT == null ? 0 : Math.min(1, Math.max(0, ((ms - emT) / 1000 - i * .05) / .9));
      const k = 1 - Math.pow(1 - e, 3);
      n.x = 572 + (790 + 200 * n.r * Math.cos(a) - 572) * k;
      n.y = 380 + (110 * n.r * Math.sin(a) + n.h * 28) * k;
      n.c.setAttribute('cx', n.x.toFixed(1));
      n.c.setAttribute('cy', n.y.toFixed(1));
      n.c.setAttribute('r', ((3.5 + 4.5 * d) * k).toFixed(1));
      n.c.setAttribute('opacity', ((.4 + .6 * d) * Math.min(1, e * 3)).toFixed(2));
    });
    const f = nodes[F];
    const tr = 'translate(' + f.x.toFixed(1) + ' ' + f.y.toFixed(1) + ')';
    $('#ringg').setAttribute('transform', tr);
    $('#kids').setAttribute('transform', tr);
    $('#sel').setAttribute('cx', f.x);
    $('#sel').setAttribute('cy', f.y);
    $('#lead').setAttribute('x1', f.x);
    $('#lead').setAttribute('y1', f.y);
    kids.forEach((k, i) => {
      const a = i * 1.047 + t * .9;
      k.setAttribute('cx', (30 * Math.cos(a)).toFixed(1));
      k.setAttribute('cy', (22 * Math.sin(a)).toFixed(1));
    });
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  let typer, timer, cur = -1;
  function setQ(txt, ph) {
    const q = $('#qt');
    q.textContent = txt || 'search anything…';
    q.setAttribute('fill', txt ? '#fff' : 'rgba(255,255,255,.5)');
    $('#cur').textContent = ph ? '|' : '';
  }

  function go(n) {
    clearTimeout(timer);
    clearInterval(typer);
    cur = n;
    if (n < 2) emT = null;
    else if (emT == null) emT = performance.now();
    svg.dataset.s = n;
    document.querySelectorAll('[data-from]').forEach(e => {
      const from = +e.dataset.from;
      const to = +e.dataset.to;
      e.classList.toggle('on', n >= from && n <= to);
    });

    const cp = $('#cap');
    cp.style.opacity = 0;
    setTimeout(() => {
      cp.textContent = CAP[n];
      cp.style.opacity = 1;
    }, 250);

    const fly = $('#fly');
    if (n === 0) {
      setQ('', true);
      let k = 0;
      const w = 'octopus';
      setTimeout(() => {
        typer = setInterval(() => {
          k++;
          setQ(w.slice(0, k), true);
          if (k >= w.length) clearInterval(typer);
        }, 120);
      }, 500);
    } else {
      setQ('octopus', n < 2);
    }

    if (n === 4) {
      const f = nodes[F];
      fly.style.transition = 'none';
      fly.style.transform = 'translate(' + f.x + 'px,' + f.y + 'px)';
      fly.style.opacity = '1';
      void fly.getBoundingClientRect();
      setTimeout(() => {
        if (cur !== 4) return;
        fly.style.transition = 'transform 1s cubic-bezier(.5,0,.2,1)';
        fly.style.transform = 'translate(1100px,240px)';
      }, 60);
      setTimeout(() => {
        if (cur === 4) fly.style.opacity = '0';
      }, 1150);
    } else {
      fly.style.opacity = '0';
    }

    timer = setTimeout(() => go((n + 1) % 5), DUR[n]);
  }

  go(0);
})();
<\/script>

</script>
