<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matt Brissette — Visual &amp; Digital Experience Designer</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: Roboto Condensed & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Roboto+Condensed:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- GSAP Animation Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

  <!-- Lenis Smooth Scroll Engine -->
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.18/dist/lenis.min.js"></script>

  <!-- Three.js (r128) & BufferGeometryUtils -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/BufferGeometryUtils.js"></script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      overflow: hidden;
      background-color: #020204;
      user-select: none;
      -webkit-user-select: none;
    }
    #info-modal, #project-drawer, #index-overlay, #lab-overlay {
      user-select: text;
      -webkit-user-select: text;
    }
    ::selection {
      background: #ffffff;
      color: #000000;
    }
    .font-heading, .font-syne {
      font-family: 'Roboto Condensed', sans-serif;
      font-weight: 500;
      letter-spacing: 0.04em;
    }
    .font-label, .font-mono-space {
      font-family: 'Roboto Condensed', sans-serif;
      font-weight: 500;
      letter-spacing: 0.05em;
    }
    .font-body, .font-inter {
      font-family: 'Inter', sans-serif;
    }
    html.lenis, html.lenis body {
      height: auto;
    }
    .lenis.lenis-smooth {
      scroll-behavior: auto !important;
    }
    .lenis.lenis-smooth [data-lenis-prevent] {
      overscroll-behavior: contain;
    }
    .lenis.lenis-stopped {
      overflow: hidden;
    }
    html, body {
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    html::-webkit-scrollbar, body::-webkit-scrollbar {
      display: none;
      width: 0;
      height: 0;
    }
    .custom-scroll::-webkit-scrollbar {
      width: 3px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: #08080c;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #ffffff;
      border-radius: 0px;
    }
    #noise-overlay {
      position: fixed;
      top: -50%;
      left: -50%;
      right: -50%;
      bottom: -50%;
      width: 200%;
      height: 200%;
      background-repeat: repeat;
      pointer-events: none;
      z-index: 48;
      opacity: 0.04;
      mix-blend-mode: screen;
      will-change: transform;
      transform: translateZ(0);
    }
    @keyframes noise-shift {
      0% { background-position: 0px 0px; }
      10% { background-position: -20px 30px; }
      20% { background-position: 40px -15px; }
      30% { background-position: -50px 20px; }
      40% { background-position: 25px -35px; }
      50% { background-position: -15px 50px; }
      60% { background-position: 45px -30px; }
      70% { background-position: -35px 15px; }
      80% { background-position: 20px -45px; }
      90% { background-position: -30px 25px; }
      100% { background-position: 0px 0px; }
    }
    .noise-active {
      animation: noise-shift 0.12s steps(2) infinite;
      background-size: 160px 160px;
    }

    @keyframes eq-bounce-1 {
      0%, 100% { height: 16px; }
      50% { height: 5px; }
    }
    @keyframes eq-bounce-2 {
      0%, 100% { height: 7px; }
      50% { height: 15px; }
    }
    @keyframes eq-bounce-3 {
      0%, 100% { height: 13px; }
      50% { height: 4px; }
    }
    @keyframes eq-bounce-4 {
      0%, 100% { height: 6px; }
      50% { height: 12px; }
    }
    .sound-bar-active:nth-child(1) {
      animation: eq-bounce-1 0.75s ease-in-out infinite alternate;
    }
    .sound-bar-active:nth-child(2) {
      animation: eq-bounce-2 0.65s ease-in-out infinite alternate 0.12s;
    }
    .sound-bar-active:nth-child(3) {
      animation: eq-bounce-3 0.85s ease-in-out infinite alternate 0.04s;
    }
    .sound-bar-active:nth-child(4) {
      animation: eq-bounce-4 0.6s ease-in-out infinite alternate 0.18s;
    }
  </style>
</head>
<body class="relative w-screen h-screen text-zinc-100 overflow-hidden bg-[#020204]">

  <!-- Film Noise Layer -->
  <div id="noise-overlay" class="noise-active"></div>

  <!-- Loading Screen: Monolith Signal Calibration -->
  <div id="loading-screen" class="fixed inset-0 z-[9999] bg-[#020204] flex flex-col items-center justify-center pointer-events-none">
    <div id="loading-inner" style="opacity:0; transform: translateY(10px); transition: opacity 0.6s ease, transform 0.6s ease;">
      <div class="flex flex-col items-center gap-3">
        <span class="font-heading font-medium text-3xl sm:text-4xl tracking-[-0.01em] leading-none text-zinc-100">MATT BRISSETTE</span>
        <div class="h-5 flex items-center justify-center">
          <span id="loading-scramble-word" class="text-xs sm:text-[13px] font-label tracking-[0.25em] text-zinc-400 uppercase font-medium min-w-[120px] text-center inline-block">BRANDING</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Virtual Scroll Track for Lenis smooth interpolation -->
  <div id="scroll-proxy" class="w-full pointer-events-none" style="height: 5200px;"></div>

  <header class="fixed top-0 left-0 w-full p-4 md:p-8 flex justify-between items-center z-40 pointer-events-none">
    <div class="flex items-center pointer-events-auto">
      <span class="font-heading font-medium text-xl sm:text-2xl md:text-3xl tracking-[-0.01em] leading-none text-zinc-100 select-none">MATT BRISSETTE</span>
    </div>
    
    <div class="hidden md:flex items-center gap-6 lg:gap-8 pointer-events-auto">
      <button id="nav-index" class="flex items-center gap-2 group py-1 border-none bg-transparent text-[#D4D4D8] hover:text-white transition-colors duration-200">
        <i data-lucide="grid" class="w-3.5 h-3.5 text-white transition-transform group-hover:scale-110 drop-shadow-[0_0_6px_#ffffff]"></i>
        <span class="font-label text-[13px] leading-[16px] font-medium tracking-[1.4px]">INDEX [07]</span>
      </button>

      <button id="nav-about" class="flex items-center gap-2 group py-1 border-none bg-transparent text-[#D4D4D8] hover:text-white transition-colors duration-200">
        <span class="font-label text-[13px] leading-[16px] font-medium tracking-[1.4px]">ABOUT</span>
      </button>

      <button id="nav-contact" class="flex items-center gap-2 group py-1 border-none bg-transparent text-[#D4D4D8] hover:text-white transition-colors duration-200">
        <span class="font-label text-[13px] leading-[16px] font-medium tracking-[1.4px]">CONTACT</span>
      </button>
    </div>

    <!-- Mobile Hamburger Toggle -->
    <button id="mobile-menu-toggle" aria-label="Toggle Menu" class="md:hidden flex items-center justify-center p-2.5 border border-zinc-800 bg-[#040407]/95 backdrop-blur text-zinc-100 hover:border-white hover:text-white transition-colors pointer-events-auto">
      <i data-lucide="menu" id="hamburger-open-icon" class="w-4 h-4"></i>
      <i data-lucide="x" id="hamburger-close-icon" class="w-4 h-4 hidden"></i>
    </button>
  </header>

  <!-- Mobile Dropdown Navigation Tray -->
  <div id="mobile-nav-tray" class="fixed inset-x-0 top-[65px] bg-[#030305]/98 backdrop-blur-xl z-[70] flex flex-col p-5 space-y-3 opacity-0 pointer-events-none transition-all duration-300 md:hidden border-b border-zinc-800 shadow-2xl">
    <button id="mobile-nav-index" class="w-full flex items-center justify-between p-3.5 border border-zinc-800 bg-zinc-950/70 hover:border-white text-zinc-100 font-label text-xs tracking-widest uppercase transition-colors">
      <div class="flex items-center gap-3">
        <i data-lucide="grid" class="w-4 h-4 text-white"></i>
        <span>INDEX CATALOG [07]</span>
      </div>
      <i data-lucide="chevron-right" class="w-4 h-4 text-zinc-500"></i>
    </button>

    <button id="mobile-nav-about" class="w-full flex items-center justify-between p-3.5 border border-zinc-800 bg-zinc-950/70 hover:border-white text-zinc-100 font-label text-xs tracking-widest uppercase transition-colors">
      <div class="flex items-center gap-3">
        <i data-lucide="info" class="w-4 h-4 text-white"></i>
        <span>ABOUT</span>
      </div>
      <i data-lucide="chevron-right" class="w-4 h-4 text-zinc-500"></i>
    </button>

    <button id="mobile-nav-contact" class="w-full flex items-center justify-between p-3.5 border border-zinc-800 bg-zinc-950/70 hover:border-white text-zinc-100 font-label text-xs tracking-widest uppercase transition-colors">
      <div class="flex items-center gap-3">
        <i data-lucide="mail" class="w-4 h-4 text-white"></i>
        <span>CONTACT</span>
      </div>
      <i data-lucide="arrow-up-right" class="w-4 h-4 text-zinc-500"></i>
    </button>
  </div>

  <!-- Lower Left Bio Statement -->
  <div class="fixed left-6 md:left-8 bottom-8 z-30 max-w-[280px] sm:max-w-[340px] pointer-events-none select-none">
    <p class="font-inter text-[12px] sm:text-[13px] leading-tight text-white tracking-normal font-normal">
      I bridge design, technology, and AI to create meaningful digital experiences.
    </p>
  </div>

  <!-- Bottom Right Sound Toggle -->
  <div class="fixed right-6 md:right-8 bottom-8 z-30 pointer-events-auto select-none">
    <button id="sound-toggle-btn" class="group flex items-end p-2 bg-transparent border-0 outline-none focus:outline-none cursor-pointer opacity-75 hover:opacity-100 transition-opacity duration-200" aria-label="Toggle Rain Ambient Sound">
      <div id="sound-bars-container" class="flex items-end gap-[3px] h-4 w-5 justify-end">
        <span class="sound-bar w-[3px] bg-white transition-all duration-200 h-[3px]"></span>
        <span class="sound-bar w-[3px] bg-white transition-all duration-200 h-[3px]"></span>
        <span class="sound-bar w-[3px] bg-white transition-all duration-200 h-[3px]"></span>
        <span class="sound-bar w-[3px] bg-white transition-all duration-200 h-[3px]"></span>
      </div>
    </button>
  </div>

  <!-- Vertical Scroll Gauge -->
  <div class="fixed right-8 top-1/4 h-2/4 w-[1px] bg-zinc-800/80 z-30 hidden md:block">
    <div id="scroll-progress-indicator" class="w-[2px] bg-white absolute top-0 -left-[0.5px] transition-all duration-100 shadow-[0_0_10px_#ffffff] will-change-transform" style="height: 15%; top: 0%;"></div>
    <span class="absolute -left-6 top-0 text-[10px] font-label font-medium text-zinc-600">01</span>
    <span class="absolute -left-6 bottom-0 text-[10px] font-label font-medium text-zinc-600">07</span>
  </div>

  <!-- WebGL Container -->
  <div id="webgl-container" class="w-full h-full fixed inset-0 z-10 cursor-default"></div>

  <!-- Monolith Project Drawer -->
  <div id="project-drawer" data-lenis-prevent class="fixed inset-0 bg-[#07070a] z-50 translate-x-full transition-transform duration-500 ease-out flex flex-col text-zinc-100 border-l border-zinc-800 will-change-transform">
    <div class="shrink-0 px-6 md:px-12 py-4 border-b border-zinc-800 flex justify-between items-center bg-[#07070a]">
      <div></div>
      <button id="close-drawer" class="flex items-center gap-1.5 px-3 py-1.5 border border-zinc-700 rounded-none text-zinc-400 hover:text-white hover:border-white transition-all duration-200 text-xs font-label font-medium bg-[#0b0c10] cursor-pointer">
        <span>CLOSE</span> <i data-lucide="x" class="w-3.5 h-3.5 inline-block text-white"></i>
      </button>
    </div>

    <div class="flex-1 overflow-y-auto custom-scroll relative">
      <div class="max-w-7xl mx-auto px-6 md:px-12 py-8 md:py-10 flex flex-col gap-10 md:gap-12">
        <div class="flex flex-col gap-6 md:gap-7">
          <h2 class="text-4xl md:text-5xl lg:text-6xl font-heading font-medium tracking-normal leading-[1.1] text-zinc-100 cursor-pointer" id="drawer-title">Project Title</h2>
          <div id="drawer-category" class="-mt-5 md:-mt-6 flex flex-wrap gap-2"></div>
          
          <div class="grid grid-cols-1 md:grid-cols-12 gap-8 md:gap-12 items-start">
            <div class="md:col-span-8 flex flex-col">
              <div class="text-zinc-300 leading-relaxed text-sm md:text-base font-inter space-y-4" id="drawer-description">—</div>
              <div id="drawer-awards-container" class="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-6"></div>
            </div>
            
            <div class="md:col-span-4 flex flex-col pt-1 md:pl-6 md:border-l border-zinc-800/80">
              <span class="text-xs font-label text-white font-medium tracking-wider mb-3 uppercase">// Contributions:</span>
              <div id="drawer-contributions" class="flex flex-col gap-2 font-label text-base md:text-lg text-zinc-100 font-medium"></div>
            </div>
          </div>
        </div>

        <div id="drawer-full-images" class="flex flex-col gap-6 w-full"></div>
      </div>
    </div>

    <div class="px-6 md:px-12 py-4 border-t border-zinc-800 bg-[#07070a] flex items-center justify-between shrink-0 select-none">
      <button id="drawer-prev-project" class="inline-flex items-center gap-2 px-4 py-2 border border-zinc-700 text-zinc-300 hover:border-white hover:text-white hover:bg-white/10 rounded-none font-label text-xs font-medium tracking-wider transition-all duration-300 disabled:opacity-30 disabled:border-zinc-800 disabled:text-zinc-600 disabled:hover:text-zinc-600 disabled:hover:bg-transparent disabled:pointer-events-none cursor-pointer">
        <span>← PREVIOUS</span>
      </button>
      <button id="drawer-next-project" class="inline-flex items-center gap-2 px-4 py-2 border border-zinc-700 text-zinc-300 hover:border-white hover:text-white hover:bg-white/10 rounded-none font-label text-xs font-medium tracking-wider transition-all duration-300 disabled:opacity-30 disabled:border-zinc-800 disabled:text-zinc-600 disabled:hover:text-zinc-600 disabled:hover:bg-transparent disabled:pointer-events-none cursor-pointer">
        <span>NEXT →</span>
      </button>
    </div>
  </div>

  <!-- Monolith Index Catalog -->
  <div id="index-overlay" data-lenis-prevent class="fixed inset-0 z-[80] bg-black opacity-0 pointer-events-none transition-all duration-300 flex flex-col justify-between p-6 md:p-12 text-zinc-100 overflow-hidden">
    <div class="flex justify-between items-center border-b border-zinc-800/80 pb-6 shrink-0">
      <div class="flex items-center gap-3">
        <span class="inline-block w-2.5 h-2.5 bg-white shadow-[0_0_10px_#ffffff]"></span>
        <span class="text-xs font-label tracking-widest text-zinc-300 uppercase font-medium">INDEX</span>
      </div>
      <button id="close-index" class="flex items-center gap-2 px-4 py-2 border border-zinc-700 hover:border-white rounded-none text-zinc-300 hover:text-white font-label text-xs font-medium transition-colors bg-[#08080d] cursor-pointer">
        <span>CLOSE</span> <i data-lucide="x" class="w-4 h-4 text-white"></i>
      </button>
    </div>

    <div class="flex-1 my-6 overflow-y-auto custom-scroll pr-2 relative">
      <table class="w-full text-left font-label text-xs md:text-sm border-collapse">
        <thead>
          <tr class="text-[11px] text-zinc-500 uppercase tracking-widest border-b border-zinc-800 font-medium">
            <th class="py-3 px-2 w-16">NO.</th>
            <th class="py-3 px-4">CLIENT / PROJECT</th>
            <th class="py-3 px-4 hidden md:table-cell">CATEGORY</th>
          </tr>
        </thead>
        <tbody id="index-table-body" class="divide-y border-zinc-800/60"></tbody>
      </table>
    </div>

    <!-- 3D Parallax Tilt Dynamic Preview Card -->
    <div id="index-hover-preview" class="fixed pointer-events-none z-[100] hidden md:block opacity-0 w-80 sm:w-[352px] bg-transparent shadow-[0_25px_50px_rgba(0,0,0,0.98)] transition-opacity duration-200 -translate-x-1/2 -translate-y-1/2 will-change-transform" style="perspective: 1000px;">
      <div id="index-preview-card-inner" class="relative w-full h-full transition-transform duration-75 ease-out will-change-transform" style="transform-style: preserve-3d;">
        <div class="relative w-full bg-black flex items-center justify-center overflow-hidden shadow-2xl border-0">
          <img id="index-preview-img" src="" alt="Project Preview" class="w-full h-auto object-contain block select-none">
          <video id="index-preview-vid" src="" autoplay loop muted playsinline class="w-full h-auto object-contain block select-none hidden"></video>
          <div id="index-preview-glare" class="absolute inset-0 pointer-events-none opacity-40 transition-all duration-75" style="background: linear-gradient(135deg, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0) 65%);"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- About / Contact Modal -->
  <div id="info-modal" data-lenis-prevent class="fixed inset-0 bg-black/92 backdrop-blur z-50 flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-300 p-4 sm:p-6 md:p-8 select-text">
    <div class="bg-[#07070a] max-w-2xl lg:max-w-3xl w-full rounded-none p-6 md:p-10 border border-zinc-800 shadow-2xl space-y-6 max-h-[90vh] overflow-y-auto custom-scroll">
      <div class="flex justify-between items-start">
        <h3 class="text-2xl font-heading font-medium text-zinc-100 tracking-widest" id="info-modal-title">ABOUT</h3>
        <button id="close-info-modal" class="p-1 border border-zinc-700 rounded-none text-zinc-400 hover:text-white hover:border-white hover:bg-zinc-900 transition-colors cursor-pointer">
          <i data-lucide="x" class="w-4 h-4 text-white"></i>
        </button>
      </div>
      <div id="info-modal-content" class="text-sm md:text-[15px] text-zinc-400 font-inter leading-relaxed space-y-4"></div>
    </div>
  </div>

  <!-- Interactive 3D Holographic HUD Prompt -->
  <div id="hud-prompt" class="fixed top-0 left-0 pointer-events-none z-30 opacity-0 transition-opacity duration-300 flex flex-col items-center will-change-transform" style="transform: translate3d(-999px, -999px, 0) translate(-50%, -100%);">
    <div class="px-3 py-1.5 bg-white text-black border-0 rounded-none shadow-[0_0_16px_rgba(255,255,255,0.7)] text-[11px] font-label tracking-widest flex items-center gap-2 font-medium uppercase">
      <span class="inline-block w-1.5 h-1.5 bg-black rounded-full animate-pulse"></span>
      <span id="hud-prompt-text">CLIENT NAME</span>
    </div>
    <div class="w-[1px] h-8 bg-white shadow-[0_0_6px_#ffffff] mt-0"></div>
  </div>

  <!-- Fullscreen Lightbox Modal -->
  <div id="lightbox-modal" data-lenis-prevent class="fixed inset-0 backdrop-blur-md z-[100] flex flex-col items-center justify-center opacity-0 pointer-events-none transition-opacity duration-300" style="background-color: rgba(2, 2, 4, 0.98);">
    <button id="close-lightbox" class="absolute top-4 right-4 md:top-6 md:right-8 flex items-center gap-1.5 px-3 py-1.5 md:px-4 md:py-2 bg-zinc-950 text-zinc-100 border border-zinc-800 hover:bg-white hover:text-black hover:border-white rounded-none transition-all duration-200 text-xs font-label font-medium z-[110] shadow-2xl cursor-pointer">
      <span>CLOSE</span> <i data-lucide="x" class="w-3.5 h-3.5 inline-block text-white"></i>
    </button>
    <div id="lightbox-indicator" class="absolute top-4 left-4 md:top-7 md:left-8 text-[10px] md:text-[11px] font-label font-medium tracking-widest text-zinc-500 uppercase pointer-events-none select-none max-w-[60%] md:max-w-none truncate">
      IMAGE 1 OF 8 // Click Image to Zoom / Drag to Pan
    </div>
    <button id="lightbox-prev" class="absolute left-2 md:left-6 top-1/2 -translate-y-1/2 w-9 h-9 md:w-12 md:h-12 flex items-center justify-center bg-zinc-950 border border-zinc-800 text-zinc-300 hover:text-black hover:border-white hover:bg-white transition-all duration-200 z-[110] rounded-none shadow-2xl cursor-pointer">
      <svg class="w-4 h-4 md:w-5 md:h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" /></svg>
    </button>
    <button id="lightbox-next" class="absolute right-2 md:right-6 top-1/2 -translate-y-1/2 w-9 h-9 md:w-12 md:h-12 flex items-center justify-center bg-zinc-950 border border-zinc-800 text-zinc-300 hover:text-black hover:border-white hover:bg-white transition-all duration-200 z-[110] rounded-none shadow-2xl cursor-pointer">
      <svg class="w-4 h-4 md:w-5 md:h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" /></svg>
    </button>
    <div id="lightbox-wrapper" class="w-full h-full flex items-center justify-center overflow-hidden px-14 py-20 md:px-20 md:py-24">
      <img id="lightbox-img" src="" alt="Portfolio specification sheet" class="max-w-full max-h-full object-contain cursor-zoom-in transition-transform duration-300 ease-out select-none" draggable="false">
      <iframe id="lightbox-embed" title="Interactive visual prototype" sandbox="allow-scripts allow-same-origin" scrolling="no" class="hidden border-0 max-w-full max-h-full h-full" style="aspect-ratio:2300 / 1596"></iframe>
      <video id="lightbox-video" src="" autoplay loop muted playsinline class="max-w-full max-h-full object-contain cursor-zoom-in transition-transform duration-300 ease-out select-none hidden"></video>
    </div>
    <div id="lightbox-thumbnails" class="absolute bottom-3 md:bottom-6 flex gap-2 md:gap-3 z-[110] px-3 py-1.5 md:px-4 md:py-2 bg-zinc-950/90 border border-zinc-800 rounded-none backdrop-blur-sm max-w-[92vw] overflow-x-auto custom-scroll"></div>
  </div>

  <script>
    const mergeGeometriesSafe = (geometries) => {
      if (window.THREE && THREE.BufferGeometryUtils && THREE.BufferGeometryUtils.mergeBufferGeometries) {
        return THREE.BufferGeometryUtils.mergeBufferGeometries(geometries);
      }
      return geometries[0] || new THREE.BufferGeometry();
    };

    const loadingScreen = document.getElementById('loading-screen');
    const loadingInner = document.getElementById('loading-inner');
    const loadingScrambleWord = document.getElementById('loading-scramble-word');

    if (loadingInner) {
      requestAnimationFrame(() => {
        loadingInner.style.opacity = '1';
        loadingInner.style.transform = 'translateY(0)';
      });
    }

    const introWords = ["BRANDING", "VISUAL", "DIGITAL", "3D"];
    const scrambleGlyphs = "!<>-_\\/[]{}—=+*^?#________";

    function scrambleTo(element, targetWord, duration = 65, onComplete) {
      if (!element) {
        if (onComplete) onComplete();
        return;
      }
      const startText = element.textContent || "";
      const maxLen = Math.max(startText.length, targetWord.length);
      const startTime = performance.now();

      function update(now) {
        const progress = Math.min((now - startTime) / duration, 1);
        let result = "";
        for (let i = 0; i < maxLen; i++) {
          if (progress * maxLen > i) {
            result += targetWord[i] || "";
          } else {
            result += scrambleGlyphs[Math.floor(Math.random() * scrambleGlyphs.length)];
          }
        }
        element.textContent = result;
        if (progress < 1) {
          requestAnimationFrame(update);
        } else {
          element.textContent = targetWord;
          if (onComplete) onComplete();
        }
      }
      requestAnimationFrame(update);
    }

    function runIntroShuffleSequence(step = 0) {
      if (!loadingScrambleWord) {
        isIntroSequenceComplete = true;

        setTimeout(() => {

      }

      setTimeout(() => {

        });
      }, 70);
    }

    let audioCtx = null;

    function initRainAudio() {
      if (audioCtx) return;
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContext();

      const bufferSize = audioCtx.sampleRate * 5;
      const buffer = audioCtx.createBuffer(2, bufferSize, audioCtx.sampleRate);
      const left = buffer.getChannelData(0);
      const right = buffer.getChannelData(1);

      let b0L = 0, b1L = 0, b2L = 0, b3L = 0, b4L = 0, b5L = 0, b6L = 0;
      let b0R = 0, b1R = 0, b2R = 0, b3R = 0, b4R = 0, b5R = 0, b6R = 0;

      for (let i = 0; i < bufferSize; i++) {
        const whiteL = Math.random() * 2 - 1;
        const whiteR = Math.random() * 2 - 1;

        b0L = 0.99886 * b0L + whiteL * 0.0555179;
        b1L = 0.99332 * b1L + whiteL * 0.0750759;
        b2L = 0.96900 * b2L + whiteL * 0.1538520;
        b3L = 0.86650 * b3L + whiteL * 0.3104856;
        b4L = 0.55000 * b4L + whiteL * 0.5329522;
        b5L = -0.7616 * b5L - whiteL * 0.0168980;
        left[i] = (b0L + b1L + b2L + b3L + b4L + b5L + b6L + whiteL * 0.5362) * 0.05;
        b6L = whiteL * 0.115926;

        b0R = 0.99886 * b0R + whiteR * 0.0555179;
        b1R = 0.99332 * b1R + whiteR * 0.0750759;
        b2R = 0.96900 * b2R + whiteR * 0.1538520;

        b4R = 0.55000 * b4R + whiteR * 0.5329522;
        b5R = -0.7616 * b5R - whiteR * 0.0168980;
        right[i] = (b0R + b1R + b2R + b3R + b4R + b5R + b6R + whiteR * 0.5362) * 0.05;
        b6R = whiteR * 0.115926;
      }

      // Crisp layer: sparse, very short noise ticks (individual drops hitting a surface)
      const sr = audioCtx.sampleRate;
      const ticksPerSecond = 70;
      const tickCount = Math.floor(ticksPerSecond * (bufferSize / sr));
      for (let t = 0; t < tickCount; t++) {
        const start = Math.floor(Math.random() * (bufferSize - 400));
        const len = Math.floor(sr * (0.0015 + Math.random() * 0.004)); // 1.5–5.5 ms
        const amp = 0.04 + Math.pow(Math.random(), 2.2) * 0.22;        // mostly soft, a few sharper
        const pan = Math.random();
        for (let k = 0; k < len; k++) {

      rainSourceNode.buffer = buffer;
      rainSourceNode.loop = true;

      // Remove low-end mud, open the top end, and add a little air for crispness
      const highpass = audioCtx.createBiquadFilter();
      highpass.type = 'highpass';
      highpass.frequency.value = 280;
      highpass.Q.value = 0.7;

      const lowpass = audioCtx.createBiquadFilter();
      lowpass.type = 'lowpass';
      lowpass.frequency.value = 6500;
      lowpass.Q.value = 0.5;

      const airShelf = audioCtx.createBiquadFilter();
      airShelf.type = 'highshelf';
      airShelf.frequency.value = 3500;
      airShelf.gain.value = 4;

      rainGainNode = audioCtx.createGain();
      rainGainNode.gain.setValueAtTime(0, audioCtx.currentTime);

      rainSourceNode.connect(highpass);
      highpass.connect(lowpass);
      lowpass.connect(airShelf);
      airShelf.connect(rainGainNode);
      rainGainNode.connect(audioCtx.destination);
      rainSourceNode.start(0);
    }

    function toggleRainAudio() {
      initRainAudio();
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      isSoundOn = !isSoundOn;

      if (isSoundOn) {
        rainGainNode.gain.cancelScheduledValues(audioCtx.currentTime);
        rainGainNode.gain.setTargetAtTime(0.27, audioCtx.currentTime, 0.4);

        soundBars.forEach(bar => {
          bar.classList.add('sound-bar-active');
        });
      } else {
        rainGainNode.gain.cancelScheduledValues(audioCtx.currentTime);
        rainGainNode.gain.setTargetAtTime(0, audioCtx.currentTime, 0.3);

        soundBars.forEach(bar => {
          bar.classList.remove('sound-bar-active');
          bar.style.height = '3px';
        });
      }
    }

    if (soundToggleBtn) {
      soundToggleBtn.addEventListener('click', (e) => {
        e.preventDefault();
        toggleRainAudio();
      });
    }

    function generateBasaltCanvas(isBump = false) {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      const numSections = 12;
      const sectionHeight = 512 / numSections;

      if (!isBump) {
        ctx.fillStyle = '#101116';
        ctx.fillRect(0, 0, 512, 512);

        for (let i = 0; i < numSections; i++) {
          const yStart = i * sectionHeight;
          const toneOffset = Math.sin(i * 2.3) * 4.0;
          const r = Math.floor(19 + toneOffset);
          const g = Math.floor(20 + toneOffset);
          const b = Math.floor(22 + toneOffset);
          
          ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;
          ctx.fillRect(0, yStart, 512, sectionHeight);

          const grad = ctx.createLinearGradient(0, yStart, 512, yStart + sectionHeight);
          grad.addColorStop(0, 'rgba(255, 255, 255, 0.02)');
          grad.addColorStop(0.5, 'rgba(0, 0, 0, 0.12)');
          grad.addColorStop(1, 'rgba(255, 255, 255, 0.015)');
          ctx.fillStyle = grad;
          ctx.fillRect(0, yStart, 512, sectionHeight);
        }

        for (let j = 0; j < 35; j++) {
          const y = Math.random() * 512;
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.035)';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(512, y + (Math.random() - 0.5) * 6);
          ctx.stroke();
        }

        for (let i = 0; i <= numSections; i++) {
          const y = i * sectionHeight;
          ctx.strokeStyle = 'rgba(5, 5, 8, 0.85)';
          ctx.lineWidth = 2.0;
          ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(512, y); ctx.stroke();

          ctx.strokeStyle = 'rgba(255, 255, 255, 0.18)';
          ctx.lineWidth = 0.75;
          ctx.beginPath(); ctx.moveTo(0, y + 1.0); ctx.lineTo(512, y + 1.0); ctx.stroke();
        }

        const imgData = ctx.getImageData(0, 0, 512, 512);
        const buf32 = new Uint32Array(imgData.data.buffer);
        const len = buf32.length;
        for (let i = 0; i < len; i++) {
          const pixel = buf32[i];
          let r = pixel & 0xFF;
          let g = (pixel >> 8) & 0xFF;
          let b = (pixel >> 16) & 0xFF;
          const a = (pixel >> 24) & 0xFF;

          const noise = (Math.random() - 0.5) * 10;
          r = Math.max(0, Math.min(255, r + noise)) | 0;
          g = Math.max(0, Math.min(255, g + noise)) | 0;
          b = Math.max(0, Math.min(255, b + noise)) | 0;

          buf32[i] = (a << 24) | (b << 16) | (g << 8) | r;
        }
        ctx.putImageData(imgData, 0, 0);

      } else {
        ctx.fillStyle = '#606065';
        ctx.fillRect(0, 0, 512, 512);

        for (let i = 0; i < numSections; i++) {
          const yStart = i * sectionHeight;
          const stepOffset = Math.sin(i * 2.3) * 5.0; 
          const grayVal = Math.floor(96 + stepOffset);
          
          ctx.fillStyle = `rgb(${grayVal}, ${grayVal}, ${grayVal})`;
          ctx.fillRect(0, yStart, 512, sectionHeight);
        }

        for (let i = 0; i <= numSections; i++) {
          const y = i * sectionHeight;
          ctx.strokeStyle = 'rgb(12, 12, 14)'; 
          ctx.lineWidth = 2.5;
          ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(512, y); ctx.stroke();
        }

        const imgData = ctx.getImageData(0, 0, 512, 512);
        const buf32 = new Uint32Array(imgData.data.buffer);
        const len = buf32.length;
        for (let i = 0; i < len; i++) {
          const pixel = buf32[i];
          let r = pixel & 0xFF;
          let g = (pixel >> 8) & 0xFF;
          let b = (pixel >> 16) & 0xFF;
          const a = (pixel >> 24) & 0xFF;

          const noise = (Math.random() - 0.5) * 12.0;
          r = Math.max(0, Math.min(255, r + noise)) | 0;
          g = Math.max(0, Math.min(255, g + noise)) | 0;
          b = Math.max(0, Math.min(255, b + noise)) | 0;

          buf32[i] = (a << 24) | (b << 16) | (g << 8) | r;
        }
        ctx.putImageData(imgData, 0, 0);
      }

      return canvas;
    }

    function generateStudioEnvironment() {
      const canvas = document.createElement('canvas');
      canvas.width = 1024;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      const skyGrad = ctx.createLinearGradient(0, 0, 0, 512);
      skyGrad.addColorStop(0, '#000000');       
      skyGrad.addColorStop(0.35, '#040404');    
      skyGrad.addColorStop(0.5, '#070707');     
      skyGrad.addColorStop(0.7, '#020202');     
      skyGrad.addColorStop(1, '#000000');       
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, 1024, 512);

      ctx.save();
      ctx.shadowColor = 'rgba(255, 255, 255, 0.95)';
      ctx.shadowBlur = 80;
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(490, 40, 44, 150);
      ctx.restore();

      ctx.save();
      ctx.shadowColor = 'rgba(255, 255, 255, 0.75)';
      ctx.shadowBlur = 100;
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(260, 30, 45, 180);
      ctx.restore();

      // Extra thin strips so wet surfaces catch broken, rain-on-glass highlights
      [[110, 20, 14, 200, 0.55, 'rgba(255,255,255,0.7)'],
       [395, 50, 10, 170, 0.45, 'rgba(255,255,255,0.6)'],
       [640, 25, 12, 190, 0.50, 'rgba(255,255,255,0.65)'],
       [820, 35, 18, 210, 0.40, 'rgba(150,190,255,0.8)'],
       [960, 45, 8, 160, 0.35, 'rgba(255,255,255,0.55)']].forEach(([x, y, w, h, a, glow]) => {
        ctx.save();
        ctx.globalAlpha = a;
        ctx.shadowColor = glow;
        ctx.shadowBlur = 40;
        ctx.fillStyle = glow.startsWith('rgba(150') ? '#9cbcff' : '#ffffff';
        ctx.fillRect(x, y, w, h);
        ctx.restore();
      });

      ctx.save();
      const horizonGlow = ctx.createRadialGradient(512, 420, 10, 512, 420, 320);
      horizonGlow.addColorStop(0, 'rgba(255, 255, 255, 0.15)');
      horizonGlow.addColorStop(0.4, 'rgba(255, 255, 255, 0.04)');
      horizonGlow.addColorStop(1, 'transparent');
      ctx.fillStyle = horizonGlow;
      ctx.beginPath(); ctx.arc(512, 420, 320, 0, Math.PI * 2); ctx.fill();
      ctx.restore();

      const texture = new THREE.CanvasTexture(canvas);
      texture.mapping = THREE.EquirectangularReflectionMapping;
      return texture;
    }

    const container = document.getElementById('webgl-container');

    const maxAnisotropy = Math.min(renderer.capabilities.getMaxAnisotropy(), 8);

    basaltBumpTex.repeat.set(2, 4);
    basaltBumpTex.minFilter = THREE.LinearMipmapLinearFilter;
    basaltBumpTex.anisotropy = maxAnisotropy;

    const basaltMaterial = new THREE.MeshStandardMaterial({

    });

    // Wet surface patch: darker albedo + low roughness in scrolling vertical runoff streaks
    const wetU = { uTime: { value: 0 }, uWet: { value: 0.7 } };
    basaltMaterial.onBeforeCompile = (s) => {
      s.uniforms.uTime = wetU.uTime;
      s.uniforms.uWet = wetU.uWet;
      s.vertexShader = s.vertexShader
        .replace('#include <common>', '#include <common>\nvarying vec3 vWPos;')
        .replace('#include <begin_vertex>',
          '#include <begin_vertex>\nvWPos = (modelMatrix * vec4(transformed, 1.0)).xyz;');
      s.fragmentShader = s.fragmentShader
        .replace('#include <common>', `#include <common>
          uniform float uTime; uniform float uWet; varying vec3 vWPos;
          float h21(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
          float vn(vec2 p){
            vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
            return mix(mix(h21(i), h21(i + vec2(1.0, 0.0)), f.x),
                       mix(h21(i + vec2(0.0, 1.0)), h21(i + vec2(1.0, 1.0)), f.x), f.y);
          }`)
        .replace('#include <roughnessmap_fragment>', `#include <roughnessmap_fragment>
          float streak = vn(vec2((vWPos.x + vWPos.z * 0.7) * 7.0, vWPos.y * 0.45 + uTime * 0.12));
          float wet = uWet * (0.45 + 0.55 * smoothstep(0.35, 0.75, streak));

          diffuseColor.rgb *= mix(1.0, 0.55, wet);`);

    const colHeight = 22.0;

    const numSteps = 160;

    const rampWidth = 1.6;
    const heightSpan = 15.0;

    const stepsGroup = new THREE.Group();
    spiralGroup.add(stepsGroup);

    const slideGeom = new THREE.BufferGeometry();
    const vertices = [];
    const indices = [];
    const uvs = [];

    const segments = 400; 
    const R1 = 1.6; 
    const R2 = 3.2; 
    const thickness = 0.25; 

    for (let i = 0; i <= segments; i++) {
      const ratio = i / segments;
      const angle = ratio * Math.PI * 2 * revolutions;
      const y = ratio * heightSpan - heightSpan / 2;

      const cos = Math.cos(angle);
      const sin = Math.sin(angle);

      vertices.push(R1 * cos, y, R1 * sin);
      vertices.push(R2 * cos, y, R2 * sin);
      vertices.push(R1 * cos, y - thickness, R1 * sin);
      vertices.push(R2 * cos, y - thickness, R2 * sin);

      const u = ratio * 15; 
      uvs.push(0, u);
      uvs.push(1, u);
      uvs.push(0, u);
      uvs.push(1, u);
    }

    for (let i = 0; i < segments; i++) {
      const curr = i * 4;
      const next = (i + 1) * 4;

      indices.push(curr + 0, next + 0, next + 1);
      indices.push(curr + 0, next + 1, curr + 1);

      indices.push(curr + 2, next + 3, next + 2);
      indices.push(curr + 2, curr + 3, next + 3);

      indices.push(curr + 1, next + 1, next + 3);
      indices.push(curr + 1, next + 3, curr + 3);

      indices.push(curr + 0, next + 2, next + 0);
      indices.push(curr + 0, curr + 2, next + 2);
    }

    slideGeom.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
    slideGeom.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
    slideGeom.setIndex(indices);
    slideGeom.computeVertexNormals();

    const slideMesh = new THREE.Mesh(slideGeom, basaltMaterial);

    slideMesh.receiveShadow = true;
    slideMesh.matrixAutoUpdate = false;
    slideMesh.updateMatrix();
    stepsGroup.add(slideMesh);

    const borderGeom = new THREE.BufferGeometry();
    const borderVertices = [];
    const borderIndices = [];
    const borderUvs = [];

    const Rb1 = 3.12; 
    const Rb2 = 3.24; 
    const guardHeight = 1.30; 

    for (let i = 0; i <= segments; i++) {
      const ratio = i / segments;
      const angle = ratio * Math.PI * 2 * revolutions;
      const y = ratio * heightSpan - heightSpan / 2;

      const cos = Math.cos(angle);
      const sin = Math.sin(angle);

      borderVertices.push(Rb1 * cos, y + guardHeight / 2, Rb1 * sin);
      borderVertices.push(Rb2 * cos, y + guardHeight / 2, Rb2 * sin);
      borderVertices.push(Rb1 * cos, y - guardHeight / 2, Rb1 * sin);
      borderVertices.push(Rb2 * cos, y - guardHeight / 2, Rb2 * sin);

      borderIndices.push(curr + 0, next + 1, curr + 1);

      borderIndices.push(curr + 2, next + 3, next + 2);
      borderIndices.push(curr + 2, curr + 3, next + 3);

      borderIndices.push(curr + 1, next + 1, next + 3);
      borderIndices.push(curr + 1, next + 3, curr + 3);

      borderIndices.push(curr + 0, next + 2, next + 0);
      borderIndices.push(curr + 0, curr + 2, next + 2);

    const rainMaterial = new THREE.ShaderMaterial({

      uniforms: {

      },
      vertexShader: `
        uniform float uTime;
        uniform vec2 uWind;
        attribute vec3 aSeed;
        attribute vec3 aParams;
        varying vec3 vColor;
        varying float vAlpha;
        #include <fog_pars_vertex>

        void main() {
          float speed = aParams.x;
          float len = aParams.y;
          float depth = aParams.z;

          float minY = -10.0;
          float maxY = 18.0;
          float heightSpan = maxY - minY;

          float fallProgress = fract((aSeed.y - uTime * speed - minY) / heightSpan);
          float currentY = maxY - fallProgress * heightSpan;

          vec3 worldPos;
          worldPos.x = aSeed.x + uWind.x * fallProgress * 3.5;
          worldPos.z = aSeed.z + uWind.y * fallProgress * 2.0;
          worldPos.y = currentY + position.y * len;

          float tailBrightness = 0.10 + depth * 0.12;
          float headBrightness = 0.38 + depth * 0.35;
          float brightness = mix(headBrightness, tailBrightness, position.y);

          vColor = vec3(brightness * 0.82, brightness * 0.90, brightness * 1.0) * 1.334;
          vAlpha = mix(0.38, 0.12, position.y);

          vec4 mvPosition = modelViewMatrix * vec4(worldPos, 1.0);
          gl_Position = projectionMatrix * mvPosition;
          #include <fog_vertex>
        }
      `,
      fragmentShader: `
        varying vec3 vColor;
        varying float vAlpha;
        #include <fog_pars_fragment>

        void main() {
          gl_FragColor = vec4(vColor, vAlpha);
          #include <fog_fragment>
        }
      `
    });

    const rainLines = new THREE.LineSegments(rainGeometry, rainMaterial);
    scene.add(rainLines);

    const screensGroup = new THREE.Group();
    spiralGroup.add(screensGroup);

    const activeProjectMeshes = [];
    const raycastTargets = [];

    const titaniumBoltsMat = new THREE.MeshStandardMaterial({
      color: 0xffffff,
      roughness: 0.18, 
      metalness: 0.95,  
      envMapIntensity: 2.2
    });

    const totalProjects = projects.length;
    projects.forEach((proj, idx) => {
      const stepIdx = Math.floor(18 + idx * (120 / (totalProjects - 1)));
      const ratio = stepIdx / numSteps;
      const angle = ratio * Math.PI * 2 * revolutions;
      const yPos = (ratio * heightSpan) - (heightSpan / 2) + 0.68; 

      const screenRadius = spiralRadius + rampWidth + 0.40; 
      const x = Math.cos(angle) * screenRadius;
      const z = Math.sin(angle) * screenRadius;

      const itemGroup = new THREE.Group();
      itemGroup.position.set(x, yPos, z);
      
      itemGroup.rotation.x = -0.06;
      itemGroup.rotation.y = Math.PI/2 - angle;

      const canvasTex = new THREE.CanvasTexture(generateScreenCanvas(idx));
      canvasTex.generateMipmaps = true;
      canvasTex.minFilter = THREE.LinearMipmapLinearFilter;
      canvasTex.magFilter = THREE.LinearFilter;
      canvasTex.anisotropy = maxAnisotropy;
      canvasTex.encoding = THREE.sRGBEncoding;

      const scaleFactor = 1.43 * 1.21; 
      const frameWidth = 2.40 * scaleFactor;
      const frameHeight = (2.40 * (9 / 16)) * scaleFactor;
      const frameDepth = 0.06 * scaleFactor;

      const bodyGeom = new THREE.BoxGeometry(frameWidth, frameHeight, frameDepth);
      const bodyMesh = new THREE.Mesh(bodyGeom, basaltMaterial);
      bodyMesh.castShadow = true;
      bodyMesh.receiveShadow = true;
      bodyMesh.matrixAutoUpdate = false;
      bodyMesh.updateMatrix();
      itemGroup.add(bodyMesh);

      bodyMesh.userData.parentItemGroup = itemGroup;
      raycastTargets.push(bodyMesh);

      const faceGeom = new THREE.PlaneGeometry(frameWidth - (0.06 * scaleFactor), frameHeight - (0.06 * scaleFactor));
      const faceMat = new THREE.MeshBasicMaterial({
        map: canvasTex,
        side: THREE.DoubleSide,
        toneMapped: false,
        fog: false
      });

      if (proj.images && proj.images[0]) {
        const textureLoader = new THREE.TextureLoader();
        textureLoader.setCrossOrigin('anonymous');
        textureLoader.load(proj.images[0], (loadedTex) => {
          loadedTex.generateMipmaps = true;
          loadedTex.minFilter = THREE.LinearMipmapLinearFilter;
          loadedTex.magFilter = THREE.LinearFilter;
          loadedTex.anisotropy = maxAnisotropy;
          loadedTex.encoding = THREE.sRGBEncoding;
          faceMat.map = loadedTex;
          faceMat.needsUpdate = true;
        });
      }

      const faceMesh = new THREE.Mesh(faceGeom, faceMat);
      faceMesh.position.z = frameDepth / 2 + 0.002; 
      faceMesh.matrixAutoUpdate = false;
      faceMesh.updateMatrix();
      itemGroup.add(faceMesh);

      if (proj.images && proj.images[0]) {
        const firstMedia = proj.images[0];
        const isVideo = firstMedia.endsWith('.mp4') || firstMedia.endsWith('.webm');
        if (isVideo) {
          const video = document.createElement('video');
          video.src = firstMedia;
          video.crossOrigin = 'anonymous';
          video.loop = true;
          video.muted = true;
          video.defaultMuted = true;
          video.playsInline = true;
          video.setAttribute('playsinline', '');
          video.setAttribute('webkit-playsinline', '');
          video.autoplay = true;
          video.play().catch(() => {});

          const tryPlay = () => { video.play().catch(() => {}); };
          window.addEventListener('click', tryPlay, { once: true });
          window.addEventListener('touchstart', tryPlay, { once: true });

          const videoTex = new THREE.VideoTexture(video);
          videoTex.generateMipmaps = false;
          videoTex.minFilter = THREE.LinearFilter;
          videoTex.magFilter = THREE.LinearFilter;
          videoTex.anisotropy = maxAnisotropy;
          videoTex.encoding = THREE.sRGBEncoding;
          faceMat.map = videoTex;
          faceMat.needsUpdate = true;
        } else {
          const textureLoader = new THREE.TextureLoader();
          textureLoader.setCrossOrigin('anonymous');
          textureLoader.load(firstMedia, (loadedTex) => {
            loadedTex.generateMipmaps = true;
            loadedTex.minFilter = THREE.LinearMipmapLinearFilter;
            loadedTex.magFilter = THREE.LinearFilter;
            loadedTex.anisotropy = maxAnisotropy;
            loadedTex.encoding = THREE.sRGBEncoding;
            faceMat.map = loadedTex;
            faceMat.needsUpdate = true;
          });
        }
      }

      const bracketGroup = new THREE.Group();
      itemGroup.add(bracketGroup);

      const armLength = 0.32;

      const hingeGeom = new THREE.CylinderGeometry(0.06, 0.06, 0.50, 16);
      hingeGeom.translate(0, 0, -frameDepth / 2 - 0.03);

      const armGeom = new THREE.BoxGeometry(0.12, 0.12, armLength);
      armGeom.rotateX(0.18);
      armGeom.translate(0, -0.22, -0.03 - armLength / 2);

      const clampPlateGeom = new THREE.BoxGeometry(0.25, 0.35, 0.02);
      clampPlateGeom.translate(0, -0.28, -0.03 - armLength);

      const mergedBracketGeom = mergeGeometriesSafe([hingeGeom, armGeom, clampPlateGeom]);
      const mergedBracketMesh = new THREE.Mesh(mergedBracketGeom, basaltMaterial);
      mergedBracketMesh.castShadow = true;
      mergedBracketMesh.receiveShadow = true;
      mergedBracketMesh.matrixAutoUpdate = false;
      mergedBracketMesh.updateMatrix();
      bracketGroup.add(mergedBracketMesh);

      const boltBaseGeom = new THREE.CylinderGeometry(0.015, 0.015, 0.01, 8);
      const boltGeoms = [];
      const boltsOffset = [[0.08, 0.12], [-0.08, 0.12], [0.08, -0.12], [-0.08, -0.12]];
      boltsOffset.forEach(b => {
        const bg = boltBaseGeom.clone();
        bg.rotateX(Math.PI / 2);
        bg.translate(b[0], -0.28 + b[1], -0.03 - armLength + 0.012);
        boltGeoms.push(bg);
      });
      const mergedBoltsGeom = mergeGeometriesSafe(boltGeoms);
      const mergedBoltsMesh = new THREE.Mesh(mergedBoltsGeom, titaniumBoltsMat);
      mergedBoltsMesh.castShadow = false;
      mergedBoltsMesh.matrixAutoUpdate = false;
      mergedBoltsMesh.updateMatrix();
      bracketGroup.add(mergedBoltsMesh);

      itemGroup.userData = {
        projectIndex: idx,
        num: proj.num,
        title: proj.title,
        angle: angle,
        yPos: yPos,
        bracketGroup: bracketGroup,
        origPosition: itemGroup.position.clone(),
        origRotation: itemGroup.rotation.clone(),
        origScale: itemGroup.scale.clone()
      };

      screensGroup.add(itemGroup);
      activeProjectMeshes.push(itemGroup);
    });

    // Floor and surface splash droplet pool (+8% increase: 756 ripple instances * 5 = 3780 splash particles)
    const SPLASH_POOL = 756;
    const DROPS_PER_SPLASH = 5;
    const SPLASH_LIFE = 0.38;
    const splashUniforms = {
      uTime: { value: 0 },
      uLife: { value: SPLASH_LIFE },
      uPixelRatio: { value: Math.min(window.devicePixelRatio || 1, 2) }
    };

    const rippleBirth = new Float32Array(SPLASH_POOL).fill(-100);
    const rippleGeom = new THREE.PlaneBufferGeometry(1, 1);
    rippleGeom.setAttribute('aBirth', new THREE.InstancedBufferAttribute(rippleBirth, 1));
    const rippleMat = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      side: THREE.DoubleSide,
      uniforms: splashUniforms,
      vertexShader: `
        uniform float uTime;
        uniform float uLife;
        attribute float aBirth;
        varying vec2 vUv;
        varying float vAge;
        void main() {
          vUv = uv;
          vAge = (uTime - aBirth) / uLife;
          gl_Position = projectionMatrix * modelViewMatrix * instanceMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        varying vec2 vUv;
        varying float vAge;
        void main() {
          if (vAge < 0.0 || vAge > 1.0) discard;
          float d = length(vUv - 0.5) * 2.0;
          float e1 = 1.0 - pow(1.0 - vAge, 2.5);
          float r1 = 0.12 + 0.88 * e1;
          float ring1 = smoothstep(0.045, 0.0, abs(d - r1));
          float a2 = clamp((vAge - 0.18) / 0.82, 0.0, 1.0);
          float r2 = 0.08 + 0.62 * (1.0 - pow(1.0 - a2, 2.5));
          float ring2 = smoothstep(0.035, 0.0, abs(d - r2)) * step(0.001, a2) * 0.45;
          float fade = pow(1.0 - vAge, 1.6);
          float a = (ring1 + ring2) * fade * 0.30;
          if (a < 0.003) discard;
          gl_FragColor = vec4(vec3(0.80, 0.90, 1.0), a);
        }
      `
    });
    const rippleMesh = new THREE.InstancedMesh(rippleGeom, rippleMat, SPLASH_POOL);
    rippleMesh.frustumCulled = false;
    rippleMesh.renderOrder = 2;
    spiralGroup.add(rippleMesh);

    const DROP_COUNT = SPLASH_POOL * DROPS_PER_SPLASH;
    const dropPos = new Float32Array(DROP_COUNT * 3);
    const dropVel = new Float32Array(DROP_COUNT * 3);
    const dropBirth = new Float32Array(DROP_COUNT).fill(-100);
    const dropSize = new Float32Array(DROP_COUNT);
    const dropGeom = new THREE.BufferGeometry();
    dropGeom.setAttribute('position', new THREE.BufferAttribute(dropPos, 3));
    dropGeom.setAttribute('aVel', new THREE.BufferAttribute(dropVel, 3));
    dropGeom.setAttribute('aBirth', new THREE.BufferAttribute(dropBirth, 1));
    dropGeom.setAttribute('aSize', new THREE.BufferAttribute(dropSize, 1));
    const dropMat = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      uniforms: splashUniforms,
      vertexShader: `
        uniform float uTime;
        uniform float uLife;
        uniform float uPixelRatio;
        attribute vec3 aVel;
        attribute float aBirth;
        attribute float aSize;
        varying float vLife;
        void main() {
          float t = uTime - aBirth;
          vLife = t / uLife;
          if (t < 0.0 || t > uLife) {
            gl_Position = vec4(2.0, 2.0, 2.0, 1.0);
            gl_PointSize = 0.0;
            return;
          }
          vec3 p = position + aVel * t;
          p.y -= 0.5 * 7.0 * t * t;
          vec4 mv = modelViewMatrix * vec4(p, 1.0);
          gl_Position = projectionMatrix * mv;
          gl_PointSize = aSize * uPixelRatio * (18.0 / -mv.z) * (1.0 - 0.5 * vLife);
        }
      `,
      fragmentShader: `
        varying float vLife;
        void main() {
          float d = length(gl_PointCoord - 0.5);
          if (d > 0.5) discard;
          float a = smoothstep(0.5, 0.05, d) * (1.0 - vLife) * 0.6;
          gl_FragColor = vec4(vec3(0.88, 0.94, 1.0), a);
        }
      `
    });
    const dropPoints = new THREE.Points(dropGeom, dropMat);
    dropPoints.frustumCulled = false;
    dropPoints.renderOrder = 3;
    spiralGroup.add(dropPoints);

    const _zAxis = new THREE.Vector3(0, 0, 1);
    const _sq = new THREE.Quaternion();
    const _sp = new THREE.Vector3();
    const _ss = new THREE.Vector3();
    const _sm = new THREE.Matrix4();
    const _sLocal = new THREE.Vector3();
    const _sWorld = new THREE.Vector3();
    const _sNdc = new THREE.Vector3();
    const _sN = new THREE.Vector3();
    const _sE = new THREE.Vector3();
    const _sT = new THREE.Vector3();
    const _sV = new THREE.Vector3();
    const SPLASH_K = heightSpan / (Math.PI * 2 * revolutions);
    const SCREEN_SF = 1.43 * 1.21;
    const SCREEN_W = 2.40 * SCREEN_SF;
    const SCREEN_H = (2.40 * (9 / 16)) * SCREEN_SF;
    const SCREEN_D = 0.06 * SCREEN_SF;

    let splashCursor = 0;
    let splashDirty = false;
    let rampAcc = 0;
    let screenAcc = 0;

    function splashVisible(localPos) {
      _sWorld.copy(localPos);
      spiralGroup.localToWorld(_sWorld);
      if (_sWorld.z < -3.0) return false;
      _sNdc.copy(_sWorld).project(camera);
      return Math.abs(_sNdc.x) < 1.0 && Math.abs(_sNdc.y) < 1.0 && _sNdc.z < 1.0;
    }

    function emitSplash(pos, n, e, t, ringScale, drops, now) {
      const i = splashCursor;
      splashCursor = (splashCursor + 1) % SPLASH_POOL;

      _sq.setFromUnitVectors(_zAxis, n);
      _sp.copy(n).multiplyScalar(0.012).add(pos);
      _ss.set(ringScale, ringScale, 1);
      _sm.compose(_sp, _sq, _ss);
      rippleMesh.setMatrixAt(i, _sm);
      rippleMesh.instanceMatrix.needsUpdate = true;
      rippleBirth[i] = now;

      for (let d = 0; d < DROPS_PER_SPLASH; d++) {
        const j = i * DROPS_PER_SPLASH + d;
        if (d >= drops) { dropBirth[j] = -100; continue; }
        const phi = Math.random() * Math.PI * 2;
        const lat = (0.12 + Math.random() * 0.28) * (ringScale > 0.14 ? 1 : 0.7);
        const up = 0.7 + Math.random() * 0.9;
        _sV.copy(n).multiplyScalar(up)
          .addScaledVector(e, Math.cos(phi) * lat)
          .addScaledVector(t, Math.sin(phi) * lat);
        dropPos[j * 3] = pos.x + n.x * 0.02;
        dropPos[j * 3 + 1] = pos.y + n.y * 0.02;
        dropPos[j * 3 + 2] = pos.z + n.z * 0.02;
        dropVel[j * 3] = _sV.x;
        dropVel[j * 3 + 1] = _sV.y;
        dropVel[j * 3 + 2] = _sV.z;
        dropBirth[j] = now;
        dropSize[j] = 0.45 + Math.random() * 0.45;
      }
      splashDirty = true;
    }

    function spawnRampSplash(now) {
      for (let attempt = 0; attempt < 6; attempt++) {
        const ratio = Math.random();
        const a = ratio * Math.PI * 2 * revolutions;
        const onGuard = Math.random() < 0.22;
        const r = onGuard ? 3.18 : 1.6 + Math.random() * 1.6;
        const y = ratio * heightSpan - heightSpan / 2 + (onGuard ? 0.65 : 0.0);
        const ca = Math.cos(a), sa = Math.sin(a);

        _sLocal.set(r * ca, y, r * sa);
        if (!splashVisible(_sLocal)) continue;

        _sE.set(ca, 0, sa);
        _sT.set(-r * sa, SPLASH_K, r * ca).normalize();
        _sN.set(SPLASH_K * sa, r, -SPLASH_K * ca).normalize();

        const scale = onGuard ? 0.10 + Math.random() * 0.05 : 0.15 + Math.random() * 0.13;
        emitSplash(_sLocal, _sN, _sE, _sT, scale, onGuard ? 2 : 3, now);
        return;
      }
    }

    function spawnScreenSplash(now) {
      if (!activeProjectMeshes.length) return;
      for (let attempt = 0; attempt < 4; attempt++) {
        const mesh = activeProjectMeshes[Math.floor(Math.random() * activeProjectMeshes.length)];
        _sLocal.set(
          (Math.random() - 0.5) * SCREEN_W * 0.94,
          SCREEN_H / 2 + 0.004,
          (Math.random() - 0.5) * SCREEN_D
        ).applyMatrix4(mesh.matrix);
        if (!splashVisible(_sLocal)) continue;

        _sN.set(0, 1, 0).applyQuaternion(mesh.quaternion);
        _sE.set(1, 0, 0).applyQuaternion(mesh.quaternion);
        _sT.set(0, 0, 1).applyQuaternion(mesh.quaternion);
        emitSplash(_sLocal, _sN, _sE, _sT, 0.08 + Math.random() * 0.04, 2, now);
        return;
      }
    }

    function updateRainImpacts(delta, now) {
      splashUniforms.uTime.value = now;

      if (!(isFocused || isTransitioning || isIndexOpen)) {
        const mobile = window.innerWidth < 768;
        const dt = Math.min(delta, 0.05);
        rampAcc += dt * (mobile ? 32 : 56);
        screenAcc += dt * (mobile ? 5 : 10);
        let guard = 0;
        while (rampAcc >= 1 && guard++ < 8) { rampAcc -= 1; spawnRampSplash(now); }
        guard = 0;
        while (screenAcc >= 1 && guard++ < 4) { screenAcc -= 1; spawnScreenSplash(now); }
        rampAcc = Math.min(rampAcc, 1);
        screenAcc = Math.min(screenAcc, 1);
      }

      if (splashDirty) {
        rippleGeom.attributes.aBirth.needsUpdate = true;
        dropGeom.attributes.position.needsUpdate = true;
        dropGeom.attributes.aVel.needsUpdate = true;
        dropGeom.attributes.aBirth.needsUpdate = true;
        dropGeom.attributes.aSize.needsUpdate = true;
        splashDirty = false;
      }
    }

    const ambientLight = new THREE.AmbientLight(0x080808, 0.55);
    scene.add(ambientLight);

    const mainLight = new THREE.DirectionalLight(0xffffff, 3.50);
    mainLight.position.set(14.0, 22.0, 6.0);
    mainLight.castShadow = true;
    mainLight.shadow.mapSize.width = 2048;
    mainLight.shadow.mapSize.height = 2048;
    mainLight.shadow.bias = -0.00050;
    mainLight.shadow.camera.near = 0.5;
    mainLight.shadow.camera.far = 60;
    mainLight.shadow.camera.left = -5;
    mainLight.shadow.camera.right = 5;
    mainLight.shadow.camera.top = 9;
    mainLight.shadow.camera.bottom = -9;
    mainLight.shadow.camera.updateProjectionMatrix();
    scene.add(mainLight);

    const monochromeRimLight = new THREE.DirectionalLight(0xffffff, 2.0);
    monochromeRimLight.position.set(-9, 3, -6);
    scene.add(monochromeRimLight);

    const deepVoidBounce = new THREE.DirectionalLight(0x94a3b8, 0.35);
    deepVoidBounce.position.set(0, -10, 4);
    scene.add(deepVoidBounce);

    const whitePointGlow = new THREE.PointLight(0xffffff, 0.5, 14, 2.2);
    whitePointGlow.position.set(2.4, -4.5, 2.0);
    scene.add(whitePointGlow);

    let isFocused = false;
    let focusedIndex = null;
    let isTransitioning = false; 
    let scrollProgress = 0.0; 
    let targetScrollProgress = 0.0;
    let activeProjectIndex = projects.length - 1; 

    const startRotY = -0.2964 * Math.PI;
    const rotYRange = 3.60 * Math.PI;

    const startPosY = -5.031;
    const posYRange = 11.25;

    function updateSpiralTransform(progress) {
      spiralGroup.rotation.y = startRotY - progress * rotYRange;
      spiralGroup.position.y = startPosY + progress * posYRange;
    }

    let lenis = null;
    if (typeof Lenis !== 'undefined') {
      lenis = new Lenis({
        lerp: 0.08, 
        duration: 1.1,
        easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
        orientation: 'vertical',
        gestureOrientation: 'vertical',
        smoothWheel: true,
        wheelMultiplier: 0.72, 
        touchMultiplier: 1.15,
        autoRaf: false 
      });

      lenis.on('scroll', (e) => {
        if (isFocused || isTransitioning || isIndexOpen) return;
        resetIdleTimer();
        scrollProgress = Math.max(0, Math.min(1, e.progress));
        targetScrollProgress = scrollProgress;
      });
    }

    let scrollVelocity = 0.0;
    const FRICTION = 0.88;
    const WHEEL_SENSITIVITY = 0.00018;
    const TOUCH_SENSITIVITY = 0.0009;

    let lastInteractionTime = Date.now();
    let autoScrollDirection = 1;
    const AUTO_SCROLL_SPEED = 0.00015; 
    const IDLE_TIME_THRESHOLD = 5000;  

    function resetIdleTimer() {
      lastInteractionTime = Date.now();
    }

    function isModalOrOverlayActive() {
      const isInfoActive = infoModal && !infoModal.classList.contains('pointer-events-none');
      const isLightboxActive = lightboxModal && !lightboxModal.classList.contains('pointer-events-none');
      return isFocused || isIndexOpen || isInfoActive || isLightboxActive;
    }

    window.addEventListener('wheel', (e) => {
      if (isModalOrOverlayActive() || isTransitioning) return;
      if (e.target.closest('#info-modal, #project-drawer, #index-overlay, #lightbox-modal')) return;
      resetIdleTimer();
      if (!lenis) {
        e.preventDefault();
        const clamped = Math.max(-50, Math.min(50, e.deltaY));
        scrollVelocity += clamped * WHEEL_SENSITIVITY;
      }
    }, { passive: !lenis });

    let touchStart = 0;
    window.addEventListener('touchstart', (e) => {
      resetIdleTimer();
      touchStart = e.touches[0].clientY;
      scrollVelocity = 0;
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
      if (isModalOrOverlayActive() || isTransitioning) return;
      if (e.target.closest('#info-modal, #project-drawer, #index-overlay, #lightbox-modal')) return;
      resetIdleTimer();
      if (!lenis) {
        const delta = touchStart - e.touches[0].clientY;
        scrollVelocity += delta * TOUCH_SENSITIVITY;
        touchStart = e.touches[0].clientY;
      }
    }, { passive: true });

    window.addEventListener('keydown', (e) => {
      if (isModalOrOverlayActive() || isTransitioning) return;
      const down = e.key === 'ArrowDown' || e.key === 'ArrowRight' || e.key === 'PageDown';
      const up   = e.key === 'ArrowUp'   || e.key === 'ArrowLeft'  || e.key === 'PageUp';
      if (!down && !up) return;
      e.preventDefault();
      resetIdleTimer();
      if (lenis) {
        const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
        const step = (down ? 1 : -1) * (maxScroll / (totalProjects - 1));
        lenis.scrollTo(window.scrollY + step, { duration: 0.8 });
      } else {
        scrollVelocity += (down ? 1 : -1) * 0.022;
      }
    });

    function tickScroll() {
      if (!lenis) {
        scrollProgress += scrollVelocity;
        scrollVelocity *= FRICTION;
      }
      
      if (Date.now() - lastInteractionTime > IDLE_TIME_THRESHOLD && Math.abs(scrollVelocity) < 0.0001) {
        if (scrollProgress >= 0.98) {
          autoScrollDirection = -1;
        } else if (scrollProgress <= 0.02) {
          autoScrollDirection = 1;
        }
        const nextProgress = scrollProgress + (autoScrollDirection * AUTO_SCROLL_SPEED);
        if (lenis) {
          const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
          lenis.scrollTo(nextProgress * maxScroll, { immediate: true });
        } else {
          scrollProgress = nextProgress;
        }
      }

      scrollProgress = Math.max(0, Math.min(1, scrollProgress));
      if (Math.abs(scrollVelocity) < 0.00001) scrollVelocity = 0;
      targetScrollProgress = scrollProgress;
    }

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let hoveredMesh = null;

    window.addEventListener('mousemove', (e) => {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
    }, { passive: true });

    let clickStartX = 0;
    let clickStartY = 0;
    const webglContainer = document.getElementById('webgl-container');

    webglContainer.addEventListener('mousedown', (e) => {
      clickStartX = e.clientX;
      clickStartY = e.clientY;
    });

    webglContainer.addEventListener('click', (e) => {
      if (isIndexOpen || isTransitioning) return;
      if (suppressNextCanvasClick) { suppressNextCanvasClick = false; return; }
      if (isFocused) return;
      const dx = e.clientX - clickStartX;
      const dy = e.clientY - clickStartY;
      if (Math.sqrt(dx*dx + dy*dy) > 10) return;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(raycastTargets, false);

      if (intersects.length > 0) {
        const rootObj = intersects[0].object.userData.parentItemGroup;
        if (rootObj && rootObj.userData.projectIndex !== undefined) {
          focusOnProject(rootObj.userData.projectIndex);
        }
      }
    });

    function focusOnProject(index) {
      if (isFocused && focusedIndex === index) return;
      
      const isTransition = isFocused; 
      const prevIndex = focusedIndex;
      
      isFocused = true;
      isTransitioning = true;
      focusedIndex = index;
      activeProjectIndex = index;
      scrollVelocity = 0;

      if (lenis) lenis.stop();

      if (hoveredMesh) {
        gsap.to(hoveredMesh.scale, { x: 1, y: 1, z: 1, duration: 0.2 });
        hoveredMesh = null;
      }

      if (isTransition && prevIndex !== null) {
        const prevMesh = activeProjectMeshes[prevIndex];
        if (prevMesh) {
          gsap.killTweensOf(prevMesh.position);
          gsap.killTweensOf(prevMesh.rotation);
          gsap.killTweensOf(prevMesh.scale);
          gsap.killTweensOf(prevMesh.userData.bracketGroup.rotation);
          
          gsap.to(prevMesh.position, {
            x: prevMesh.userData.origPosition.x,
            y: prevMesh.userData.origPosition.y,
            z: prevMesh.userData.origPosition.z,
            duration: 0.6,
            ease: "power2.out"
          });
          gsap.to(prevMesh.rotation, {
            x: prevMesh.userData.origRotation.x,
            y: prevMesh.userData.origRotation.y,
            z: prevMesh.userData.origRotation.z,
            duration: 0.6,
            ease: "power2.out"
          });
          gsap.to(prevMesh.scale, {
            x: prevMesh.userData.origScale.x,
            y: prevMesh.userData.origScale.y,
            z: prevMesh.userData.origScale.z,
            duration: 0.6,
            ease: "power2.out"
          });
          gsap.to(prevMesh.userData.bracketGroup.rotation, {
            y: 0,
            duration: 0.6,
            ease: "power2.out"
          });
        }
      }

      const targetMesh = activeProjectMeshes[index];

      const angle = targetMesh.userData.angle;
      const outwardX = Math.cos(angle);
      const outwardZ = Math.sin(angle);

      const localTargetPos = targetMesh.userData.origPosition.clone().add(new THREE.Vector3(outwardX * 1.40, 1.10, outwardZ * 1.40));
      const localTargetRot = targetMesh.userData.origRotation.clone();
      localTargetRot.y -= 0.12; 
      localTargetRot.x += 0.04;

      const targetScroll = ((totalProjects - 1) - index) / (totalProjects - 1);

      scrollProgress = targetScroll;
      targetScrollProgress = targetScroll;
      updateSpiralTransform(scrollProgress);

      const finalSpiralRotY = startRotY - targetScroll * rotYRange;
      const finalSpiralY = startPosY + targetScroll * posYRange;

      const worldPos = localTargetPos.clone().applyAxisAngle(new THREE.Vector3(0, 1, 0), finalSpiralRotY);
      worldPos.y += finalSpiralY;

      const isDesktop = window.innerWidth >= 1280;
      const isLaptop = window.innerWidth >= 1024 && window.innerWidth < 1280;
      
      let camXOffset = isDesktop ? 1.45 : (isLaptop ? 1.15 : 0.0);

      const targetCamPos = new THREE.Vector3(
        worldPos.x + camXOffset,
        worldPos.y + 0.10,
        worldPos.z + 4.30
      );

      const targetLookAt = new THREE.Vector3(
        worldPos.x + camXOffset,
        worldPos.y,
        worldPos.z
      );

      gsap.killTweensOf(camera.position);
      gsap.killTweensOf(cameraTarget);

      const animDuration = isTransition ? 0.65 : 0.8;

      gsap.to(camera.position, {
        x: targetCamPos.x,
        y: targetCamPos.y,
        z: targetCamPos.z,
        duration: animDuration,
        ease: "power2.inOut",
        onComplete: () => {
          isTransitioning = false;
        }
      });

      gsap.to(cameraTarget, {
        x: targetLookAt.x,
        y: targetLookAt.y,
        z: targetLookAt.z,
        duration: animDuration,
        ease: "power2.inOut",
        onUpdate: () => {
          camera.lookAt(cameraTarget);
        }
      });

      gsap.killTweensOf(targetMesh.position);
      gsap.killTweensOf(targetMesh.rotation);
      gsap.killTweensOf(targetMesh.scale);
      gsap.killTweensOf(targetMesh.userData.bracketGroup.rotation);

      gsap.to(targetMesh.position, {
        x: localTargetPos.x,
        y: localTargetPos.y,
        z: localTargetPos.z,
        duration: animDuration,
        ease: "power2.inOut"
      });

      gsap.to(targetMesh.rotation, {
        x: localTargetRot.x,
        y: localTargetRot.y,
        z: localTargetRot.z,
        duration: animDuration,
        ease: "power2.inOut"
      });

      gsap.to(targetMesh.scale, {
        x: targetMesh.userData.origScale.x,
        y: targetMesh.userData.origScale.y,
        z: targetMesh.userData.origScale.z,
        duration: animDuration,
        ease: "power2.inOut"
      });

      gsap.to(targetMesh.userData.bracketGroup.rotation, {
        y: 0.38,
        duration: animDuration,
        ease: "power2.inOut"
      });

      if (hudPrompt) {
        hudPrompt.style.opacity = '0';
      }

      requestAnimationFrame(() => {
        populateDrawer(index);
        if (projectDrawer) {
          projectDrawer.classList.remove('translate-x-full');
        }
      });
    }

    function closeProjectDrawer() {
      if (!isFocused) return;
      
      const targetMesh = activeProjectMeshes[focusedIndex];
      isFocused = false;
      isTransitioning = true;
      focusedIndex = null;
      scrollVelocity = 0;
      resetIdleTimer();

      if (projectDrawer) {
        projectDrawer.classList.add('translate-x-full');
      }

      if (targetMesh) {
        gsap.killTweensOf(targetMesh.position);
        gsap.killTweensOf(targetMesh.rotation);
        gsap.killTweensOf(targetMesh.scale);
        gsap.killTweensOf(targetMesh.userData.bracketGroup.rotation);
        
        gsap.to(targetMesh.position, {
          x: targetMesh.userData.origPosition.x,
          y: targetMesh.userData.origPosition.y,
          z: targetMesh.userData.origPosition.z,
          duration: 0.65,
          ease: "power2.out"
        });
        gsap.to(targetMesh.rotation, {
          x: targetMesh.userData.origRotation.x,
          y: targetMesh.userData.origRotation.y,
          z: targetMesh.userData.origRotation.z,
          duration: 0.65,
          ease: "power2.out"
        });
        gsap.to(targetMesh.scale, {
          x: targetMesh.userData.origScale.x,
          y: targetMesh.userData.origScale.y,
          z: targetMesh.userData.origScale.z,
          duration: 0.65,
          ease: "power2.out"
        });
        gsap.to(targetMesh.userData.bracketGroup.rotation, {
          y: 0,
          duration: 0.65,
          ease: "power2.out"
        });
      }

      const defaultTargetY = 0.2;
      const defaultCamPos = new THREE.Vector3(
        mouseLerpX * 0.8,
        1.8 + (mouseLerpY * 0.5),
        9.8 - (Math.abs(mouseLerpX) * 0.4)
      );

      gsap.killTweensOf(camera.position);
      gsap.killTweensOf(cameraTarget);

      gsap.to(camera.position, {
        x: defaultCamPos.x,
        y: defaultCamPos.y,
        z: defaultCamPos.z,
        duration: 0.65,
        ease: "power2.out",
        onComplete: () => {
          isTransitioning = false;
          scrollVelocity = 0;
          resetIdleTimer();
          if (lenis) {
            const maxScroll = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
            const targetY = scrollProgress * maxScroll;
            window.scrollTo(0, targetY);
            lenis.scroll = targetY;
            lenis.targetScroll = targetY;
            lenis.velocity = 0;
            lenis.scrollTo(targetY, { immediate: true, force: true });
            lenis.start();
          }
        }
      });

      gsap.to(cameraTarget, {
        x: 0,
        y: defaultTargetY,
        z: 0,
        duration: 0.65,
        ease: "power2.out",
        onUpdate: () => {
          camera.lookAt(cameraTarget);
        }
      });
    }

    if (closeDrawerBtn) {
      closeDrawerBtn.addEventListener('click', closeProjectDrawer);
    }

    let suppressNextCanvasClick = false;
    document.addEventListener('pointerdown', (e) => {
      if (!isFocused) return;
      if (projectDrawer && projectDrawer.contains(e.target)) return;
      if (lightboxModal && lightboxModal.contains(e.target)) return;
      if (infoModal && infoModal.contains(e.target)) return;
      closeProjectDrawer();
      suppressNextCanvasClick = true;
    }, true);

    let isIndexOpen = false;
    let activeHoverRow = null;

    function renderIndexTable() {
      if (!indexTableBody) return;
      indexTableBody.innerHTML = '';

      const reversedProjects = projects.slice().reverse();

      reversedProjects.forEach((proj) => {
        const originalIdx = projects.findIndex(p => p.num === proj.num);
        const tr = document.createElement('tr');
        tr.className = 'index-row group hover:bg-zinc-900/60 hover:text-white cursor-pointer transition-colors duration-150 border-b border-zinc-800/40';

        tr.innerHTML = `
          <td class="py-4 px-2 text-white font-heading font-medium text-base group-hover:translate-x-1 transition-transform idx-num-cell">${proj.num}</td>
          <td class="py-4 px-4 font-heading font-medium text-xl tracking-wider text-zinc-100 group-hover:text-white transition-colors">
            <span class="idx-title-cell block">${proj.title}</span>
          </td>
          <td class="py-4 px-4 hidden md:table-cell text-zinc-400 font-label text-xs uppercase font-medium">${proj.category || proj.tag}</td>
        `;

        tr.addEventListener('mouseenter', () => {
          activeHoverRow = tr;

          if (proj.images && proj.images[0]) {
            const firstMedia = proj.images[0];
            const isVid = firstMedia.endsWith('.mp4') || firstMedia.endsWith('.webm');
            if (isVid) {
              if (indexPreviewImg) indexPreviewImg.classList.add('hidden');
              if (indexPreviewVid) {
                indexPreviewVid.classList.remove('hidden');
                indexPreviewVid.src = firstMedia;
                indexPreviewVid.play().catch(() => {});
              }
            } else {
              if (indexPreviewVid) {
                indexPreviewVid.pause();
                indexPreviewVid.classList.add('hidden');
              }
              if (indexPreviewImg) {
                indexPreviewImg.classList.remove('hidden');
                indexPreviewImg.src = firstMedia;
              }
            }
            if (indexHoverPreview) {
              indexHoverPreview.classList.remove('opacity-0');
              indexHoverPreview.classList.add('opacity-100');
            }
          }
        });

        tr.addEventListener('mouseleave', () => {
          activeHoverRow = null;
          if (indexPreviewVid) indexPreviewVid.pause();
          if (indexHoverPreview) {
            indexHoverPreview.classList.remove('opacity-100');
            indexHoverPreview.classList.add('opacity-0');
          }
          const innerCard = document.getElementById('index-preview-card-inner');
          if (innerCard) {
            innerCard.style.transform = 'rotateX(0deg) rotateY(0deg) translateZ(0px)';
          }
        });

        tr.addEventListener('click', () => {
          closeIndexOverlay();
          setTimeout(() => {
            focusOnProject(originalIdx);
          }, 150);
        });

        indexTableBody.appendChild(tr);
      });

      if (window.lucide) lucide.createIcons();
    }

    function openIndexOverlay() {
      if (isIndexOpen) return;
      isIndexOpen = true;
      if (lenis) lenis.stop();
      if (indexOverlay) {
        indexOverlay.classList.remove('pointer-events-none', 'opacity-0');
        indexOverlay.classList.add('opacity-100');
      }
      renderIndexTable();
    }

    function closeIndexOverlay() {
      if (!isIndexOpen) return;
      isIndexOpen = false;
      if (lenis) lenis.start();
      if (indexOverlay) {
        indexOverlay.classList.add('pointer-events-none', 'opacity-0');
        indexOverlay.classList.remove('opacity-100');
      }
      if (indexHoverPreview) {
        indexHoverPreview.classList.remove('opacity-100');
        indexHoverPreview.classList.add('opacity-0');
      }
    }

    window.addEventListener('mousemove', (e) => {
      if (isIndexOpen && indexHoverPreview && indexHoverPreview.classList.contains('opacity-100')) {
        const previewWidth = indexHoverPreview.offsetWidth || 352;
        const previewHeight = indexHoverPreview.offsetHeight || 220;
        
        let leftPos = e.clientX + 32;
        let topPos = e.clientY - (previewHeight / 2);

        if (leftPos + (previewWidth / 2) > window.innerWidth - 20) {
          leftPos = e.clientX - (previewWidth / 2) - 40;
        }
        if (topPos < 20) topPos = 20;
        if (topPos + previewHeight > window.innerHeight - 20) {
          topPos = window.innerHeight - previewHeight - 20;
        }

        indexHoverPreview.style.transform = `translate3d(${leftPos}px, ${topPos}px, 0)`;

        const innerCard = document.getElementById('index-preview-card-inner');
        const glare = document.getElementById('index-preview-glare');

        if (innerCard && activeHoverRow) {
          const rect = activeHoverRow.getBoundingClientRect();
          const normX = Math.max(-0.5, Math.min(0.5, (e.clientX - rect.left) / rect.width - 0.5));
          const normY = Math.max(-0.5, Math.min(0.5, (e.clientY - rect.top) / rect.height - 0.5));

          const tiltY = normX * 36;
          const tiltX = -normY * 24;

          innerCard.style.transform = `rotateX(${tiltX.toFixed(2)}deg) rotateY(${tiltY.toFixed(2)}deg) translateZ(12px) scale(1.03)`;

          if (glare) {
            const angle = Math.atan2(normY, normX) * (180 / Math.PI) + 90;
            const opacity = 0.20 + (Math.sqrt(normX * normX + normY * normY) * 0.5);
            glare.style.background = `linear-gradient(${angle.toFixed(0)}deg, rgba(255,255,255,${opacity.toFixed(2)}) 0%, rgba(255,255,255,0) 65%)`;
          }
        }
      }
    }, { passive: true });

    if (navIndexBtn) navIndexBtn.addEventListener('click', (e) => { e.preventDefault(); openIndexOverlay(); });
    if (closeIndexBtn) closeIndexBtn.addEventListener('click', (e) => { e.preventDefault(); closeIndexOverlay(); });

            frame.loading = 'lazy';

          hint.innerHTML = `<span class="text-[10px] font-label font-medium tracking-widest uppercase">EXPAND</span><svg class="w-3.5 h-3.5 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7" /></svg>`;

      if (drawerScrollArea) drawerScrollArea.scrollTop = 0;
    }
